<style>

</style>

<script>
const DATA = [{"id": "1", "sec": "第一讲", "type": "单选题", "q": "1938 年，历史学家蒋廷黻在哪部著作的开篇总论中提出了著名的\"蒋廷黻之问\"？（ ）", "options": [{"k": "A", "v": "《建国方略》"}, {"k": "B", "v": "《中国共产党历史》"}, {"k": "C", "v": "《中国近代史》"}, {"k": "D", "v": "《关于进一步全面深化改革的决定》"}], "a": "C", "at": "C. 《中国近代史》", "note": "蒋廷黻 1938 年出版《中国近代史》，开篇总论提出\"中国人能近代化吗？能赶上西洋人吗？\"这一著名的\"蒋廷黻之问\"。"}, {"id": "2", "sec": "第一讲", "type": "单选题", "q": "称赞中国式现代化为全球南方提供\"独特且日益契合的框架\"的斯蒂芬·恩代格瓦，担任执行主任的智库来自哪个国家？（ ）", "options": [{"k": "A", "v": "肯尼亚"}, {"k": "B", "v": "南非"}, {"k": "C", "v": "尼日利亚"}, {"k": "D", "v": "埃及"}], "a": "A", "at": "A. 肯尼亚", "note": "斯蒂芬·恩代格瓦（Stephen Ndegwa）是肯尼亚人，任发展中国家智库\"南方中心\"执行主任。"}, {"id": "3", "sec": "第一讲", "type": "单选题", "q": "以帕森斯等为代表的美国学者提出的经典现代化理论认为（ ）", "options": [{"k": "A", "v": "每个国家都应探索符合自身国情的现代化道路"}, {"k": "B", "v": "发达国家的历史经验展现了通往现代化的必经之路"}, {"k": "C", "v": "后发国家根本不可能实现现代化"}, {"k": "D", "v": "现代化必须把工业化与海外殖民相结合"}], "a": "B", "at": "B. 发达国家的历史经验展现了通往现代化的必经之路", "note": "经典现代化理论以西方发达国家为模板，认为发达国家走过的路就是后发国家的\"必经之路\"，即\"现代化=西方化\"。"}, {"id": "4", "sec": "第一讲", "type": "单选题", "q": "长期以来西方先发国家把现代化描绘成一条预设好的\"单行道\"，可概括为哪个公式？（ ）", "options": [{"k": "A", "v": "工业化＋信息化＋全球化"}, {"k": "B", "v": "工业化＋城市化＋民主化"}, {"k": "C", "v": "市场化＋私有化＋自由化"}, {"k": "D", "v": "城市化＋福利国家＋殖民扩张"}], "a": "B", "at": "B. 工业化＋城市化＋民主化", "note": "西方经典现代化叙事将现代化概括为\"工业化＋城市化＋民主化\"的单行道。"}, {"id": "5", "sec": "第一讲", "type": "单选题", "q": "中国相对西方逐渐衰落的一个制度性原因是，从明朝后期开始，中国实行了（ ）", "options": [{"k": "A", "v": "海外扩张政策"}, {"k": "B", "v": "闭关锁国政策"}, {"k": "C", "v": "自由贸易政策"}, {"k": "D", "v": "君主立宪政策"}], "a": "B", "at": "B. 闭关锁国政策", "note": "明清闭关锁国使中国错失工业革命与世界市场的发展机遇，是近代落后的重要制度性原因。"}, {"id": "6", "sec": "第一讲", "type": "单选题", "q": "19 世纪 80 年代，谁就预料到一场大规模世界大战不可避免，并预言它会\"把整个欧洲都吃得干干净净，比任何时候的蝗虫群还要吃得厉害\"？（ ）", "options": [{"k": "A", "v": "马克思"}, {"k": "B", "v": "恩格斯"}, {"k": "C", "v": "帕森斯"}, {"k": "D", "v": "列宁"}], "a": "B", "at": "B. 恩格斯", "note": "恩格斯在 19 世纪 80 年代的书信中做出这一著名预言，后被一战的历史所印证。"}, {"id": "7", "sec": "第一讲", "type": "单选题", "q": "中国第一艘自制蒸汽轮船\"万年清\"号是哪一运动的产物？（ ）", "options": [{"k": "A", "v": "戊戌变法"}, {"k": "B", "v": "洋务运动"}, {"k": "C", "v": "新民主主义革命"}, {"k": "D", "v": "改革开放"}], "a": "B", "at": "B. 洋务运动", "note": "\"万年清\"号 1869 年由福建船政局（马尾）建造，是洋务运动的产物。"}, {"id": "8", "sec": "第一讲", "type": "单选题", "q": "\"万年清\"号之所以被设计成难度极高的兵商两用船，其根本原因是（ ）", "options": [{"k": "A", "v": "一项深思熟虑的军事战略"}, {"k": "B", "v": "该设计在技术上的先进性"}, {"k": "C", "v": "经费掣肘，不得已而为之"}, {"k": "D", "v": "外国列强的直接干预"}], "a": "C", "at": "C. 经费掣肘，不得已而为之", "note": "造船经费短缺，一船两用是不得已的妥协设计，而非战略考量或技术先进性的体现。"}, {"id": "9", "sec": "第一讲", "type": "单选题", "q": "如果说洋务派看到的危机是\"器不如人\"，那么以康有为、梁启超为代表的维新派痛感的是（ ）", "options": [{"k": "A", "v": "器不如人"}, {"k": "B", "v": "制不如人"}, {"k": "C", "v": "人不如人"}, {"k": "D", "v": "地不如人"}], "a": "B", "at": "B. 制不如人", "note": "维新派认识到问题不在器物层面而在制度层面，主张变法改制，即\"制不如人\"。"}, {"id": "10", "sec": "第一讲", "type": "单选题", "q": "1895 年春天康有为联合千余名举人发起的\"公车上书\"，将变革的锋芒从船炮指向了（ ）", "options": [{"k": "A", "v": "土地分配"}, {"k": "B", "v": "制度"}, {"k": "C", "v": "扫盲教育"}, {"k": "D", "v": "军事训练"}], "a": "B", "at": "B. 制度", "note": "公车上书要求\"变法成天下之治\"，把变革矛头从器物转向制度。"}, {"id": "11", "sec": "第一讲", "type": "单选题", "q": "孙中山先生描绘\"修建 10 万英里铁路、100 万英里公路，建设东方大港、北方大港\"宏伟蓝图的著作是（ ）", "options": [{"k": "A", "v": "《中国近代史》"}, {"k": "B", "v": "《公车上书》"}, {"k": "C", "v": "《建国方略》"}, {"k": "D", "v": "《关于进一步全面深化改革的决定》"}], "a": "C", "at": "C. 《建国方略》", "note": "《建国方略》中的\"实业计划\"提出了上述铁路、公路与大港建设蓝图。"}, {"id": "12", "sec": "第一讲", "type": "单选题", "q": "毛泽东主席对近代以来现代化探索失败给出过精辟论断：一是社会制度腐败，二是（ ）", "options": [{"k": "A", "v": "人口太多"}, {"k": "B", "v": "外援中断"}, {"k": "C", "v": "经济技术落后"}, {"k": "D", "v": "人民不够聪明"}], "a": "C", "at": "C. 经济技术落后", "note": "毛泽东的论断是\"一是社会制度腐败，二是经济技术落后\"，二者是近代现代化探索失败的根本原因。"}, {"id": "13", "sec": "第一讲", "type": "单选题", "q": "中国式现代化的真正起点应当从何时算起？（ ）", "options": [{"k": "A", "v": "1840 年国门被炮舰轰开"}, {"k": "B", "v": "1978 年改革开放初期"}, {"k": "C", "v": "1949 年中华人民共和国成立"}, {"k": "D", "v": "1921 年嘉兴南湖那条小船"}], "a": "D", "at": "D. 1921 年嘉兴南湖那条小船", "note": "中国式现代化是中国共产党领导并推动的现代化，其真正起点应追溯到 1921 年中国共产党成立——嘉兴南湖那条小船上确立的领导力量，开启了党领导人民探索现代化的百年征程。"}, {"id": "14", "sec": "第一讲", "type": "单选题", "q": "1949 年，现代化工业产值只占中国工农业总产值的多少？（ ）", "options": [{"k": "A", "v": "7%"}, {"k": "B", "v": "17%"}, {"k": "C", "v": "30%"}, {"k": "D", "v": "50%"}], "a": "B", "at": "B. 17%", "note": "1949 年现代化工业产值仅占工农业总产值约 17%，工业基础极其薄弱。"}, {"id": "15", "sec": "第一讲", "type": "单选题", "q": "苏联对中国的援助在哪一年中断？（ ）", "options": [{"k": "A", "v": "1949 年"}, {"k": "B", "v": "1953 年"}, {"k": "C", "v": "1960 年"}, {"k": "D", "v": "1978 年"}], "a": "C", "at": "C. 1960 年", "note": "1960 年中苏关系破裂，苏联撤走全部专家、中断援助，中国被迫独立自主探索工业化道路。"}, {"id": "16", "sec": "第一讲", "type": "单选题", "q": "从第一个五年计划开始，中国集中力量建设了多少个重点项目？（ ）", "options": [{"k": "A", "v": "18 个"}, {"k": "B", "v": "156 个"}, {"k": "C", "v": "300 个"}, {"k": "D", "v": "540 个"}], "a": "B", "at": "B. 156 个", "note": "\"一五\"计划以 156 个重点工业项目为核心，奠定了新中国工业化的初步基础。"}, {"id": "17", "sec": "第一讲", "type": "单选题", "q": "在村里扫盲夜校第一次学会书写自己名字的申纪兰，是中华人民共和国历史上唯一连任多少届的全国人大代表？（ ）", "options": [{"k": "A", "v": "5 届"}, {"k": "B", "v": "10 届"}, {"k": "C", "v": "13 届"}, {"k": "D", "v": "18 届"}], "a": "C", "at": "C. 13 届", "note": "申纪兰连任第一届至第十三届全国人大代表，是唯一连任十三届的代表。"}, {"id": "18", "sec": "第一讲", "type": "单选题", "q": "1978 年冬天，安徽凤阳小岗村的 18 户农民立下\"生死状\"、按下红手印，实施了（ ）", "options": [{"k": "A", "v": "人民公社制度"}, {"k": "B", "v": "\"分田到户\"的农业\"大包干\""}, {"k": "C", "v": "全国扫盲运动"}, {"k": "D", "v": "156 个重点工业项目"}], "a": "B", "at": "B. \"分田到户\"的农业\"大包干\"", "note": "小岗村 18 户农民按手印搞\"大包干\"，拉开农村改革序幕。"}, {"id": "19", "sec": "第一讲", "type": "单选题", "q": "邓小平是在哪一时间提出要\"走出一条中国式的现代化道路\"？（ ）", "options": [{"k": "A", "v": "1978 年出访日本期间"}, {"k": "B", "v": "1979 年 3 月"}, {"k": "C", "v": "1987 年\"三步走\"战略确立时"}, {"k": "D", "v": "2012 年新时代开启时"}], "a": "B", "at": "B. 1979 年 3 月", "note": "1979 年 3 月，邓小平在党的理论工作务虚会上提出\"走出一条中国式的现代化道路\"。"}, {"id": "20", "sec": "第一讲", "type": "单选题", "q": "景宁 2019 年推出、并迭代 AI 辅助诊断的\"智慧流动医院\"模式，2024 年在哪一国际场合亮相？（ ）", "options": [{"k": "A", "v": "联合国大会"}, {"k": "B", "v": "日内瓦世界卫生大会"}, {"k": "C", "v": "二十国集团峰会"}, {"k": "D", "v": "达沃斯世界经济论坛"}], "a": "B", "at": "B. 日内瓦世界卫生大会", "note": "浙江景宁\"智慧流动医院\"模式 2024 年亮相日内瓦世界卫生大会，成为中国基层医疗经验走向世界的案例。"}, {"id": "21", "sec": "第一讲", "type": "多选题", "q": "下列哪些属于习近平总书记提出的擘画人类命运共同体的\"六个现代化\"？（ ）", "options": [{"k": "A", "v": "公正合理的现代化"}, {"k": "B", "v": "人民至上的现代化"}, {"k": "C", "v": "生态友好的现代化"}, {"k": "D", "v": "和平安全的现代化"}], "a": "ABCD", "at": "A. 公正合理的现代化；B. 人民至上的现代化；C. 生态友好的现代化；D. 和平安全的现代化", "note": "\"六个现代化\"指：公正合理、开放共赢、人民至上、多元包容、生态友好、和平安全。"}, {"id": "22", "sec": "第一讲", "type": "多选题", "q": "西方主流叙事遮蔽了其崛起背后的\"血腥底色\"。下列哪些被明确提及？（ ）", "options": [{"k": "A", "v": "英国工业革命离不开海外市场的暴力开辟"}, {"k": "B", "v": "美国的崛起建立在原住民驱离与黑奴贸易之上"}, {"k": "C", "v": "欧洲福利国家的财富基底沉淀着数百年殖民掠夺"}, {"k": "D", "v": "日本战后崛起依靠新干线高速铁路"}], "a": "ABC", "at": "A. 英国工业革命离不开海外市场的暴力开辟；B. 美国的崛起建立在原住民驱离与黑奴贸易之上；C. 欧洲福利国家的财富基底沉淀着数百年殖民掠夺", "note": "A、B、C 均为讲稿明确提及的\"血腥底色\"；D 项与\"血腥底色\"无关。"}, {"id": "23", "sec": "第一讲", "type": "多选题", "q": "描述不平等世界秩序的\"三个从属于\"，包括使（ ）", "options": [{"k": "A", "v": "未开化和半开化的国家从属于文明的国家"}, {"k": "B", "v": "农师的民族从属于资产阶级的民族"}, {"k": "C", "v": "东方从属于西方"}, {"k": "D", "v": "后发国家从属于国际法"}], "a": "ABC", "at": "A. 未开化和半开化的国家从属于文明的国家；B. 农师的民族从属于资产阶级的民族；C. 东方从属于西方", "note": "\"三个从属于\"出自《共产党宣言》：\"未开化和半开化的国家从属于文明的国家\"\"农民的民族从属于资产阶级的民族\"\"东方从属于西方\"。"}, {"id": "24", "sec": "第一讲", "type": "多选题", "q": "下列哪些人物在讲稿中被列为洋务派？（ ）", "options": [{"k": "A", "v": "曾国藩"}, {"k": "B", "v": "李鸿章"}, {"k": "C", "v": "左宗棠"}, {"k": "D", "v": "张之洞"}], "a": "ABCD", "at": "A. 曾国藩；B. 李鸿章；C. 左宗棠；D. 张之洞", "note": "四人均为洋务派代表人物，全选。"}, {"id": "25", "sec": "第一讲", "type": "多选题", "q": "光绪皇帝在百日维新期间颁布的新政诏令包括（ ）", "options": [{"k": "A", "v": "废除八股"}, {"k": "B", "v": "兴建京师大学堂"}, {"k": "C", "v": "设立铁路矿务局"}, {"k": "D", "v": "允许民间办厂"}], "a": "ABCD", "at": "A. 废除八股；B. 兴建京师大学堂；C. 设立铁路矿务局；D. 允许民间办厂", "note": "四项均属百日维新新政内容（文教：废八股、办京师大学堂；经济：设铁路矿务局、奖励私人办厂），全选。"}, {"id": "26", "sec": "第一讲", "type": "多选题", "q": "中国共产党自诞生之日起就清醒认识到两项不可分割的任务，即（ ）", "options": [{"k": "A", "v": "\"破\"——推翻腐朽的社会制度"}, {"k": "B", "v": "\"立\"——实现经济技术的长足发展"}, {"k": "C", "v": "忠实照搬西方议会制度"}, {"k": "D", "v": "维护皇权根基"}], "a": "AB", "at": "A. \"破\"——推翻腐朽的社会制度；B. \"立\"——实现经济技术的长足发展", "note": "即\"破\"与\"立\"两大任务；C、D 与党的性质和纲领相悖。"}, {"id": "27", "sec": "第一讲", "type": "多选题", "q": "1949 年之后这片土地上发生的具象变化包括（ ）", "options": [{"k": "A", "v": "停泊在港口上百年的外国军舰被开走了"}, {"k": "B", "v": "\"华人与狗不得入内\"的牌子被砸碎了"}, {"k": "C", "v": "三亿多无地少地的农民第一次拥有了自己的土地"}, {"k": "D", "v": "中国立即超过了发达国家的 GDP"}], "a": "ABC", "at": "A. 停泊在港口上百年的外国军舰被开走了；B. \"华人与狗不得入内\"的牌子被砸碎了；C. 三亿多无地少地的农民第一次拥有了自己的土地", "note": "A、B、C 均为新中国成立初期的具象变化；D 项不符合史实。"}, {"id": "28", "sec": "第一讲", "type": "多选题", "q": "1949 年的中国是一个\"一穷二白\"的国家。下列哪些描述了它当时的状况？（ ）", "options": [{"k": "A", "v": "重工业几乎为零"}, {"k": "B", "v": "钢产量按人头分只够每人打一把菜刀"}, {"k": "C", "v": "5.4 亿人口中超过 80% 是文盲"}, {"k": "D", "v": "当时印度的工业基础远在中国之上"}], "a": "ABCD", "at": "A. 重工业几乎为零；B. 钢产量按人头分只够每人打一把菜刀；C. 5.4 亿人口中超过 80% 是文盲；D. 当时印度的工业基础远在中国之上", "note": "四项均为讲稿对 1949 年\"一穷二白\"状况的描述，全选。"}, {"id": "29", "sec": "第一讲", "type": "多选题", "q": "20 世纪 50 年代的扫盲运动取得了哪些成果？（ ）", "options": [{"k": "A", "v": "砸碎了\"女子无才便是德\"的千年枷锁"}, {"k": "B", "v": "到 1953 年底有超过 3000 万妇女参加扫盲学习"}, {"k": "C", "v": "数以百万计的农民成为新中国第一批会计、技术员、拖拉机手"}, {"k": "D", "v": "打破了\"劳心者治人，劳力者治于人\"的知识垄断格局"}], "a": "ABCD", "at": "A. 砸碎了\"女子无才便是德\"的千年枷锁；B. 到 1953 年底有超过 3000 万妇女参加扫盲学习；C. 数以百万计的农民成为新中国第一批会计、技术员、拖拉机手；D. 打破了\"劳心者治人，劳力者治于人\"的知识垄断格局", "note": "四项均为扫盲运动的成果，全选。"}, {"id": "30", "sec": "第一讲", "type": "多选题", "q": "今天中国式现代化仍然面临的严峻挑战包括（ ）", "options": [{"k": "A", "v": "人口老龄化问题"}, {"k": "B", "v": "被美国卡脖子的芯片困境"}, {"k": "C", "v": "不平衡的城乡发展水平"}, {"k": "D", "v": "地方债务风险与房地产市场深度调整"}], "a": "ABCD", "at": "A. 人口老龄化问题；B. 被美国卡脖子的芯片困境；C. 不平衡的城乡发展水平；D. 地方债务风险与房地产市场深度调整", "note": "四项均为当前面临的现实挑战，全选。"}, {"id": "31", "sec": "第一讲", "type": "判断题", "q": "中国式现代化的起点应当从 1978 年改革开放算起。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中国式现代化的真正起点是 1949 年新中国成立，1978 年是重要发展阶段而非起点。"}, {"id": "32", "sec": "第一讲", "type": "判断题", "q": "帕森斯的经典现代化理论正确解释了广大后发国家的政治转型现实。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "该理论以西方为模板，无法解释后发国家政治转型的复杂现实，遭到广泛批评。"}, {"id": "33", "sec": "第一讲", "type": "判断题", "q": "\"万年清\"号选用的立式蒸汽机虽节省了横向空间，却抬高了干舷，导致船舶重心上升、中弹概率增加。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "立式蒸汽机抬高舰体重心、加大受弹面，是早期国产舰船设计上的真实缺陷。"}, {"id": "34", "sec": "第一讲", "type": "判断题", "q": "甲午海战前，清廷上下忙于慈禧寿辰筹备，消极备战。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "1894 年恰逢慈禧六十大寿，朝廷重庆典、轻战备，消极备战属实。"}, {"id": "35", "sec": "第一讲", "type": "判断题", "q": "1912 年中华民国成立后，中国的政党一度多达 300 余个。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "民初政党林立，登记政党、社团一度达 300 多个。"}, {"id": "36", "sec": "第一讲", "type": "判断题", "q": "工业化被称为是传统农业社会向现代工业社会转型这场变革的\"发动机\"。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "工业化是现代化的基础和核心动力，是这场转型的\"发动机\"。"}, {"id": "37", "sec": "第一讲", "type": "判断题", "q": "邓小平主张用发达国家的标准来衡量中国的现代化。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "邓小平提出\"中国式的现代化\"，立足中国国情、以\"小康\"为阶段性目标，而非照搬发达国家标准。"}, {"id": "38", "sec": "第一讲", "type": "判断题", "q": "1987 年确立的\"三步走\"战略提出，到 21 世纪中叶基本实现现代化，达到中等发达国家水平。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "党的十三大确立\"三步走\"战略：温饱 → 小康 → 到 21 世纪中叶人均国民生产总值达到中等发达国家水平、基本实现现代化。"}, {"id": "39", "sec": "第一讲", "type": "判断题", "q": "2013 年，习近平指出中国的现代化和西方发达国家一样，应当采取\"串联式\"的顺序发展过程。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "西方现代化是\"串联式\"（依次发展），中国的现代化是\"并联式\"——工业化、信息化、城镇化、农业现代化叠加发展。"}, {"id": "40", "sec": "第一讲", "type": "判断题", "q": "2025 年，中国经济总量超过 140 万亿元，近 5 年来对世界经济增长的贡献率平均在 30% 左右。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "2025 年我国 GDP 首次突破 140 万亿元大关；近 5 年对世界经济增长的平均贡献率约 30%，是全球经济增长的重要引擎。"}, {"id": "1", "sec": "第二讲", "type": "单选题", "q": "中国式现代化是中国共产党领导的社会主义现代化，其最本质的特征是（ ）", "options": [{"k": "A", "v": "实现共同富裕"}, {"k": "B", "v": "坚持中国共产党领导"}, {"k": "C", "v": "坚持社会主义市场经济"}, {"k": "D", "v": "人与自然和谐共生"}], "a": "B", "at": "B. 坚持中国共产党领导", "note": "中国共产党领导是中国式现代化区别于其他现代化道路的本质特征。"}, {"id": "2", "sec": "第二讲", "type": "单选题", "q": "中国式现代化区别于西方现代化的一个显著标志是（ ）", "options": [{"k": "A", "v": "先污染后治理"}, {"k": "B", "v": "以资本为中心"}, {"k": "C", "v": "全体人民共同富裕"}, {"k": "D", "v": "依靠殖民扩张"}], "a": "C", "at": "C. 全体人民共同富裕", "note": "中国式现代化坚持以人民为中心，追求全体人民共同富裕。"}, {"id": "3", "sec": "第二讲", "type": "单选题", "q": "在“两步走”战略安排中，到2035年我国要达成的目标是（ ）", "options": [{"k": "A", "v": "全面建成小康社会"}, {"k": "B", "v": "基本实现社会主义现代化"}, {"k": "C", "v": "建成社会主义现代化强国"}, {"k": "D", "v": "进入创新型国家后列"}], "a": "B", "at": "B. 基本实现社会主义现代化", "note": "“两步走”安排的第一步是到2035年基本实现社会主义现代化。"}, {"id": "4", "sec": "第二讲", "type": "单选题", "q": "中国式现代化创造的“两大奇迹”是（ ）", "options": [{"k": "A", "v": "经济快速发展和脱贫攻坚胜利"}, {"k": "B", "v": "城镇化和工业化同步推进"}, {"k": "C", "v": "基础设施建设突飞猛进和科技弯道超车"}, {"k": "D", "v": "经济快速发展和社会长期稳定"}], "a": "D", "at": "D. 经济快速发展和社会长期稳定", "note": "改革开放以来，中国创造了经济快速发展和社会长期稳定两大奇迹。"}, {"id": "5", "sec": "第二讲", "type": "单选题", "q": "中国制造业增加值占全球比重近（ ），连续15年位居世界第一。", "options": [{"k": "A", "v": "20%"}, {"k": "B", "v": "15%"}, {"k": "C", "v": "40%"}, {"k": "D", "v": "30%"}], "a": "D", "at": "D. 30%", "note": "中国制造业增加值占全球比重约三成，规模连续多年位居世界第一。"}, {"id": "6", "sec": "第二讲", "type": "单选题", "q": "“中国式现代化理论”是（ ）的重要理论创新。", "options": [{"k": "A", "v": "党的十九大"}, {"k": "B", "v": "党的二十大"}, {"k": "C", "v": "党的十八届三中全会"}, {"k": "D", "v": "党的十九届六中全会"}], "a": "B", "at": "B. 党的二十大", "note": "党的二十大系统阐述了中国式现代化的中国特色、本质要求和重大原则。"}, {"id": "7", "sec": "第二讲", "type": "单选题", "q": "从发展目标看，中国式现代化最终要实现的根本目的是（ ）", "options": [{"k": "A", "v": "全体人民共同富裕"}, {"k": "B", "v": "GDP总量世界第一"}, {"k": "C", "v": "城镇化率达到90%"}, {"k": "D", "v": "制造业规模翻两番"}], "a": "A", "at": "A. 全体人民共同富裕", "note": "促进全体人民共同富裕是中国式现代化的本质要求和根本目的之一。"}, {"id": "8", "sec": "第二讲", "type": "单选题", "q": "中国共产党的诞生对于中国现代化进程的意义在于（ ）", "options": [{"k": "A", "v": "提出了“师夷长技”的主张"}, {"k": "B", "v": "实现了从旧民主主义向新民主主义的转变，使现代化探索由被动转为主动"}, {"k": "C", "v": "彻底消灭了封建土地所有制"}, {"k": "D", "v": "完成了第一次工业革命"}], "a": "B", "at": "B. 实现了从旧民主主义向新民主主义的转变，使现代化探索由被动转为主动", "note": "中国共产党成立后，中国人民争取民族独立、人民解放和现代化发展的探索有了先进领导力量。"}, {"id": "9", "sec": "第二讲", "type": "单选题", "q": "中国共产党能够凝聚奋斗力量的根本原因不包括（ ）", "options": [{"k": "A", "v": "初心使命的感召力"}, {"k": "B", "v": "组织动员的执行力"}, {"k": "C", "v": "多党竞争的推动力"}, {"k": "D", "v": "自我革命的净化力"}], "a": "C", "at": "C. 多党竞争的推动力", "note": "中国共产党凝聚力量依靠初心使命、组织动员和自我革命等优势，并非多党竞争。"}, {"id": "10", "sec": "第二讲", "type": "单选题", "q": "中国式现代化在经济体制方面坚持（ ）", "options": [{"k": "A", "v": "完全自由市场经济"}, {"k": "B", "v": "计划经济为主"}, {"k": "C", "v": "单一公有制经济"}, {"k": "D", "v": "社会主义市场经济体制"}], "a": "D", "at": "D. 社会主义市场经济体制", "note": "中国坚持和完善社会主义市场经济体制，发挥市场和政府各自作用。"}, {"id": "11", "sec": "第二讲", "type": "单选题", "q": "关于理论创新的根本动力，下列说法正确的是（ ）", "options": [{"k": "A", "v": "借鉴西方经典理论"}, {"k": "B", "v": "保持理论教条不变"}, {"k": "C", "v": "坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合"}, {"k": "D", "v": "依靠照搬苏联模式"}], "a": "C", "at": "C. 坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合", "note": "理论创新必须立足中国实际，并同中华优秀传统文化相结合。"}, {"id": "12", "sec": "第二讲", "type": "单选题", "q": "中国共产党是中国工人阶级的先锋队，是中国人民和中华民族的先锋队，党的根本宗旨是（ ）。", "options": [{"k": "A", "v": "实现共同富裕"}, {"k": "B", "v": "实现共产主义"}, {"k": "C", "v": "全心全意为人民服务"}, {"k": "D", "v": "解放和发展生产力"}], "a": "C", "at": "C. 全心全意为人民服务", "note": "全心全意为人民服务是中国共产党的根本宗旨。"}, {"id": "13", "sec": "第二讲", "type": "单选题", "q": "下列哪项不是中国式现代化的基本特征（ ）", "options": [{"k": "A", "v": "全体人民共同富裕"}, {"k": "B", "v": "物质文明和精神文明相协调"}, {"k": "C", "v": "先发展后治理"}, {"k": "D", "v": "人与自然和谐共生"}], "a": "C", "at": "C. 先发展后治理", "note": "中国式现代化强调人与自然和谐共生，不走先污染后治理的老路。"}, {"id": "14", "sec": "第二讲", "type": "单选题", "q": "中国式现代化的主体力量是（ ）", "options": [{"k": "A", "v": "国有企业"}, {"k": "B", "v": "中国共产党"}, {"k": "C", "v": "广大党员干部"}, {"k": "D", "v": "中国人民"}], "a": "D", "at": "D. 中国人民", "note": "人民是历史的创造者，也是推进中国式现代化的主体力量。"}, {"id": "15", "sec": "第二讲", "type": "单选题", "q": "在对外开放方面，中国式现代化坚持的理念是（ ）", "options": [{"k": "A", "v": "脱钩断链"}, {"k": "B", "v": "封闭自守"}, {"k": "C", "v": "互利共赢"}, {"k": "D", "v": "零和博弈"}], "a": "C", "at": "C. 互利共赢", "note": "中国坚持高水平对外开放，倡导合作共赢、互利共赢。"}, {"id": "16", "sec": "第二讲", "type": "单选题", "q": "“全球发展倡议、全球安全倡议、全球文明倡议、（ ）”是中国为应对当今世界面临的共同挑战、推动构建人类命运共同体提出的四项系统性公共产品。", "options": [{"k": "A", "v": "全球治理倡议"}, {"k": "B", "v": "全球卫生倡议"}, {"k": "C", "v": "全球绿色倡议"}, {"k": "D", "v": "全球共享倡议"}], "a": "A", "at": "A. 全球治理倡议", "note": "四项倡议分别是全球发展、安全、文明和治理倡议。"}, {"id": "17", "sec": "第二讲", "type": "单选题", "q": "中国式现代化所创造的“人类文明新形态”，其核心意义在于（ ）", "options": [{"k": "A", "v": "证明了现代化只有一种模式"}, {"k": "B", "v": "打破了“现代化=西方化”的迷思"}, {"k": "C", "v": "证明了资本主义的终结"}, {"k": "D", "v": "实现了区域一体化"}], "a": "B", "at": "B. 打破了“现代化=西方化”的迷思", "note": "中国式现代化表明，现代化道路可以立足本国国情、呈现多样形态。"}, {"id": "18", "sec": "第二讲", "type": "单选题", "q": "新民主主义革命推翻了帝国主义、封建主义和（ ）。", "options": [{"k": "A", "v": "买办资本主义"}, {"k": "B", "v": "空想社会主义"}, {"k": "C", "v": "无政府主义"}, {"k": "D", "v": "官僚资本主义"}], "a": "D", "at": "D. 官僚资本主义", "note": "新民主主义革命的对象包括帝国主义、封建主义和官僚资本主义。"}, {"id": "19", "sec": "第二讲", "type": "单选题", "q": "中国式现代化对国际社会的主要贡献是（ ）", "options": [{"k": "A", "v": "提供实现现代化的新选择"}, {"k": "B", "v": "输出发展模式"}, {"k": "C", "v": "争夺全球霸权"}, {"k": "D", "v": "封闭阵营对抗"}], "a": "A", "at": "A. 提供实现现代化的新选择", "note": "中国式现代化为广大发展中国家探索适合自身国情的现代化道路提供了新选择。"}, {"id": "20", "sec": "第二讲", "type": "单选题", "q": "新时代以来，中国科研经费总量位居世界（ ）", "options": [{"k": "A", "v": "第一位"}, {"k": "B", "v": "第二位"}, {"k": "C", "v": "第三位"}, {"k": "D", "v": "第四位"}], "a": "B", "at": "B. 第二位", "note": "按题目所依据的课程材料，中国科研经费投入总量位居世界第二。"}, {"id": "21", "sec": "第二讲", "type": "多选题", "q": "党的领导直接关系中国式现代化的（ ）。", "options": [{"k": "A", "v": "根本方向"}, {"k": "B", "v": "前途命运"}, {"k": "C", "v": "最终成败"}, {"k": "D", "v": "完成时间"}], "a": "ABC", "at": "A. 根本方向；B. 前途命运；C. 最终成败", "note": "党的领导关系中国式现代化的根本方向、前途命运和最终成败。"}, {"id": "22", "sec": "第二讲", "type": "多选题", "q": "关于中国式现代化与西方现代化的区别，下列表述正确的有（ ）", "options": [{"k": "A", "v": "以人民为中心 vs 以资本为中心"}, {"k": "B", "v": "共同富裕 vs 贫富两极分化"}, {"k": "C", "v": "和平发展 vs 殖民扩张"}, {"k": "D", "v": "人与自然和谐 vs 先污染后治理"}], "a": "ABCD", "at": "A. 以人民为中心 vs 以资本为中心；B. 共同富裕 vs 贫富两极分化；C. 和平发展 vs 殖民扩张；D. 人与自然和谐 vs 先污染后治理", "note": "四组比较分别对应中国式现代化与西方传统现代化的价值取向和发展方式差异。"}, {"id": "23", "sec": "第二讲", "type": "多选题", "q": "实现中国式现代化必须牢牢把握的重大原则不包括（ ）", "options": [{"k": "A", "v": "坚持和加强人民代表大会制度"}, {"k": "B", "v": "坚持中国特色社会主义道路"}, {"k": "C", "v": "坚持以经济建设为中心的发展思想"}, {"k": "D", "v": "坚持发扬改革精神"}], "a": "ACD", "at": "A. 坚持和加强人民代表大会制度；C. 坚持以经济建设为中心的发展思想；D. 坚持发扬改革精神", "note": "重大原则的规范表述包括坚持党的全面领导、走中国特色社会主义道路、坚持以人民为中心、深化改革开放和发扬斗争精神。"}, {"id": "24", "sec": "第二讲", "type": "多选题", "q": "中国的现代化，是一种独特的“并联式”发展，（ ）交头并进，复杂程度世所罕见。", "options": [{"k": "A", "v": "工业化"}, {"k": "B", "v": "信息化"}, {"k": "C", "v": "城镇化"}, {"k": "D", "v": "农业现代化"}], "a": "ABCD", "at": "A. 工业化；B. 信息化；C. 城镇化；D. 农业现代化", "note": "中国式现代化把工业化、信息化、城镇化和农业现代化叠加推进。"}, {"id": "25", "sec": "第二讲", "type": "多选题", "q": "中国式现代化走和平发展道路的具体表现有（ ）", "options": [{"k": "A", "v": "积极参与全球治理体系改革"}, {"k": "B", "v": "推动构建人类命运共同体"}, {"k": "C", "v": "坚持不称霸、不扩张"}, {"k": "D", "v": "反对一切形式的恐怖主义"}], "a": "ABCD", "at": "A. 积极参与全球治理体系改革；B. 推动构建人类命运共同体；C. 坚持不称霸、不扩张；D. 反对一切形式的恐怖主义", "note": "四项都体现了中国坚持和平发展、合作发展和共同发展的立场。"}, {"id": "26", "sec": "第二讲", "type": "多选题", "q": "中国式现代化对发展中国家的启示包括（ ）", "options": [{"k": "A", "v": "发展道路应适合本国国情"}, {"k": "B", "v": "全盘西化可以事半功倍"}, {"k": "C", "v": "必须坚持独立自主"}, {"k": "D", "v": "可以复制中国所有具体做法"}], "a": "AC", "at": "A. 发展道路应适合本国国情；C. 必须坚持独立自主", "note": "发展中国家应立足自身国情、坚持独立自主，不能照搬任何国家的具体模式。"}, {"id": "27", "sec": "第二讲", "type": "多选题", "q": "以下哪些属于全面建设社会主义现代化国家的战略安排（ ）", "options": [{"k": "A", "v": "从2020年到2035年，基本实现社会主义现代化"}, {"k": "B", "v": "从2035年到本世纪中叶，建成社会主义现代化强国"}, {"k": "C", "v": "到2025年，完全实现社会主义现代化"}, {"k": "D", "v": "到2030年，成为世界第一大经济体"}], "a": "AB", "at": "A. 从2020年到2035年，基本实现社会主义现代化；B. 从2035年到本世纪中叶，建成社会主义现代化强国", "note": "“两步走”战略安排是2020—2035年基本实现现代化、2035年至本世纪中叶建成强国。"}, {"id": "28", "sec": "第二讲", "type": "多选题", "q": "洋务运动、戊戌变法、辛亥革命等探索为什么都失败了？（ ）", "options": [{"k": "A", "v": "脱离中国国情"}, {"k": "B", "v": "无法凝聚全民力量"}, {"k": "C", "v": "始终跟在别人后面亦步亦趋"}, {"k": "D", "v": "没有学习先进科学技术"}], "a": "ABC", "at": "A. 脱离中国国情；B. 无法凝聚全民力量；C. 始终跟在别人后面亦步亦趋", "note": "这些探索受制于脱离国情、缺乏广泛动员和缺少自主道路等局限，D项不符合洋务运动等实际。"}, {"id": "29", "sec": "第二讲", "type": "多选题", "q": "中国共产党通过哪四股力把14亿中国人民凝聚成了一个整体？（ ）", "options": [{"k": "A", "v": "初心使命的感召力"}, {"k": "B", "v": "组织动员的执行力"}, {"k": "C", "v": "统一战线的团结力"}, {"k": "D", "v": "自我革命的净化力"}], "a": "ABCD", "at": "A. 初心使命的感召力；B. 组织动员的执行力；C. 统一战线的团结力；D. 自我革命的净化力", "note": "初心使命、组织动员、统一战线和自我革命共同构成党的凝聚力来源。"}, {"id": "30", "sec": "第二讲", "type": "多选题", "q": "关于中国式现代化对世界的贡献和意义，以下表述正确的是（ ）", "options": [{"k": "A", "v": "对西方式现代化之路进行了全盘否定"}, {"k": "B", "v": "为发展中国家提供了全新选择"}, {"k": "C", "v": "创造了人类文明新形态"}, {"k": "D", "v": "是对世界各国现代化模式的简单复制"}], "a": "BC", "at": "B. 为发展中国家提供了全新选择；C. 创造了人类文明新形态", "note": "中国式现代化提供新选择、创造新形态，但不是对西方道路的全盘否定或简单复制。"}, {"id": "31", "sec": "第二讲", "type": "判断题", "q": "中国式现代化坚持人与自然和谐共生，不再走先污染后治理的老路。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化把人与自然和谐共生作为重要特征和本质要求。"}, {"id": "32", "sec": "第二讲", "type": "判断题", "q": "中国式现代化可以完全脱离党的领导而依靠市场自发实现。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "党的领导是中国式现代化的本质特征和根本保证。"}, {"id": "33", "sec": "第二讲", "type": "判断题", "q": "中国式现代化坚持独立自主，就是要独立于世界经济体系之外。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "独立自主强调立足自身、把发展主动权掌握在自己手中，不等于封闭脱离世界。"}, {"id": "34", "sec": "第二讲", "type": "判断题", "q": "人口规模巨大是中国式现代化面临的基本国情和重要特征。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "人口规模巨大是中国式现代化区别于其他现代化的重要国情。"}, {"id": "35", "sec": "第二讲", "type": "判断题", "q": "中国式现代化只需依靠少数高科技人才的力量即可实现，不需要凝聚亿万人民的参与。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中国式现代化是全体人民共同参与、共同建设、共同享有的现代化。"}, {"id": "36", "sec": "第二讲", "type": "判断题", "q": "中国式现代化不需要推进农业现代化，只发展工业和服务业即可。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "农业现代化是中国式现代化的重要组成部分，必须与其他现代化协同推进。"}, {"id": "37", "sec": "第二讲", "type": "判断题", "q": "中国式现代化走和平发展道路，这是基于历史文化传统和现实国情的选择。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "和平发展符合中华优秀传统文化，也符合中国自身发展需要和世界共同利益。"}, {"id": "38", "sec": "第二讲", "type": "判断题", "q": "中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化既遵循现代化一般规律，又具有鲜明的中国特色。"}, {"id": "39", "sec": "第二讲", "type": "判断题", "q": "中国式现代化是全体人民同步富裕的现代化。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中国式现代化追求全体人民共同富裕，不是同一时间、同一程度的同步富裕。"}, {"id": "40", "sec": "第二讲", "type": "判断题", "q": "近代以来，中国的洋务运动、戊戌变法、辛亥革命等早期探索均以失败告终，根本原因在于缺乏科学的理论指导和先进阶级的领导。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "近代探索缺少科学理论指导和先进阶级领导，因而无法完成民族独立和现代化建设任务。"}, {"id": "1", "sec": "第三讲", "type": "单选题", "q": "习近平总书记在党的二十大报告中阐述的中国式现代化五个中国特色中，排在首位的是（ ）", "options": [{"k": "A", "v": "全体人民共同富裕的现代化"}, {"k": "B", "v": "人口规模巨大的现代化"}, {"k": "C", "v": "物质文明和精神文明相协调的现代化"}, {"k": "D", "v": "人与自然和谐共生的现代化"}], "a": "B", "at": "B. 人口规模巨大的现代化", "note": "党的二十大报告阐述的五个中国特色中，第一个就是\"人口规模巨大的现代化\"，其后依次是全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。"}, {"id": "2", "sec": "第三讲", "type": "单选题", "q": "人口规模巨大的中国式现代化与西方式现代化相比的特点是（ ）", "options": [{"k": "A", "v": "拥有成熟完备的现代化建设经验"}, {"k": "B", "v": "有自己的发展逻辑与理论，艰巨性、复杂性前所未有"}, {"k": "C", "v": "完全依托外部循环实现现代化发展"}, {"k": "D", "v": "发展路径与西方现代化模式高度一致"}], "a": "B", "at": "B. 有自己的发展逻辑与理论，艰巨性、复杂性前所未有", "note": "迄今为止实现现代化的国家人口加起来不到 10 亿，而中国是 14 亿多人口整体迈入现代化，没有先例可循，必须有自身的发展逻辑与理论，艰巨性和复杂性前所未有。"}, {"id": "3", "sec": "第三讲", "type": "单选题", "q": "针对人口规模巨大的现代化如何破题，习近平总书记指明的核心工作总方向不包括（ ）", "options": [{"k": "A", "v": "始终从国情出发想问题、作决策、办事情"}, {"k": "B", "v": "既不好高骛远，也不因循守旧"}, {"k": "C", "v": "保持历史耐心，坚持稳中求进、循序渐进、持续推进"}, {"k": "D", "v": "追求高速赶超，快速达到发达国家水平"}], "a": "D", "at": "D. 追求高速赶超，快速达到发达国家水平", "note": "习近平总书记强调的是从国情出发、不好高骛远不因循守旧、保持历史耐心稳中求进；\"追求高速赶超、快速达标\"与稳中求进的总方向相悖。"}, {"id": "4", "sec": "第三讲", "type": "单选题", "q": "我国人口规模巨大的基本国情，决定了现代化建设应当（ ）", "options": [{"k": "A", "v": "粗放式开发、规模化扩张"}, {"k": "B", "v": "精打细算、优化资源配置，适配人口发展需求"}, {"k": "C", "v": "优先保障工业用地，弱化民生用地保障"}, {"k": "D", "v": "照搬西方资源利用模式快速发展"}], "a": "B", "at": "B. 精打细算、优化资源配置，适配人口发展需求", "note": "人口规模巨大意味着人均资源相对紧张，必须精打细算、优化资源配置，使发展供给与人口发展需求相适配，而不能走粗放扩张或照搬西方的老路。"}, {"id": "5", "sec": "第三讲", "type": "单选题", "q": "庞大人口基数给我国现代化建设带来的严峻挑战是（ ）", "options": [{"k": "A", "v": "发展动力不足、市场体量狭小"}, {"k": "B", "v": "公共服务压力大、要素保障难度高、资源环境约束更强"}, {"k": "C", "v": "区域发展高度同质化"}, {"k": "D", "v": "劳动力资源整体匮乏"}], "a": "B", "at": "B. 公共服务压力大、要素保障难度高、资源环境约束更强", "note": "\"大有大的难处\"：庞大人口使就业、教育、医疗、养老等基本公共服务压力大，要素保障难度高，资源环境约束更紧；A、D 与事实相反，C 表述不成立。"}, {"id": "6", "sec": "第三讲", "type": "单选题", "q": "人口规模巨大为中国式现代化发展提供的供给优势是（ ）", "options": [{"k": "A", "v": "海量劳动力与技能人才储备，支撑产业持续发展"}, {"k": "B", "v": "自然资源总量远超世界各国"}, {"k": "C", "v": "完全规避产业转型带来的就业冲击"}, {"k": "D", "v": "无需依靠技术创新即可实现发展"}], "a": "A", "at": "A. 海量劳动力与技能人才储备，支撑产业持续发展", "note": "我国有近 9 亿劳动力、超过 2 亿的技能人才，海量人力资源和人才储备是供给端的核心优势；B、C、D 均不符合实际。"}, {"id": "7", "sec": "第三讲", "type": "单选题", "q": "人口规模巨大赋予中国式现代化的需求端优势是（ ）", "options": [{"k": "A", "v": "单一化的消费结构"}, {"k": "B", "v": "超大规模市场与超大经济体量，发展底气充足"}, {"k": "C", "v": "彻底摆脱国际市场依赖"}, {"k": "D", "v": "居民贫富差距完全消除"}], "a": "B", "at": "B. 超大规模市场与超大经济体量，发展底气充足", "note": "14 亿多人口、4 亿多中等收入群体构成超大规模市场，加上超大经济体量，使我国发展内需底气充足；A、C、D 均与事实不符。"}, {"id": "8", "sec": "第三讲", "type": "单选题", "q": "超大规模经济体的核心发展要求是（ ）", "options": [{"k": "A", "v": "依托外部大循环，被动融入全球体系"}, {"k": "B", "v": "内部可循环，牢牢把握发展主导权"}, {"k": "C", "v": "弱化自主发展，全面对接国际规则"}, {"k": "D", "v": "放弃产业升级，依托人口红利粗放发展"}], "a": "B", "at": "B. 内部可循环，牢牢把握发展主导权", "note": "超大规模经济体必须立足内部可循环，以国内大循环为主体，牢牢把握发展主导权，而不是被动依附外部循环。"}, {"id": "9", "sec": "第三讲", "type": "单选题", "q": "新时代我国人口发展呈现的三大趋势性特征不包括（ ）", "options": [{"k": "A", "v": "少子化"}, {"k": "B", "v": "老龄化"}, {"k": "C", "v": "区域人口增减分化"}, {"k": "D", "v": "人口总量高速增长"}], "a": "D", "at": "D. 人口总量高速增长", "note": "新时代人口发展三大趋势是少子化、老龄化、区域人口增减分化；我国人口已进入负增长阶段，\"总量高速增长\"不属于其中。"}, {"id": "10", "sec": "第三讲", "type": "单选题", "q": "被写入党的二十届三中全会《决定》，助力人口高质量发展的建设内容是（ ）", "options": [{"k": "A", "v": "人口服务体系"}, {"k": "B", "v": "医疗卫生体系"}, {"k": "C", "v": "社会保障体系"}, {"k": "D", "v": "公共教育体系"}], "a": "A", "at": "A. 人口服务体系", "note": "党的二十届三中全会《决定》提出\"健全人口发展支持和服务体系\"，以应对人口发展趋势、促进人口高质量发展。"}, {"id": "11", "sec": "第三讲", "type": "单选题", "q": "我国赶超发展模式对人口红利转型带来的重要影响是（ ）", "options": [{"k": "A", "v": "延长人口数量红利周期，无需转型"}, {"k": "B", "v": "缩短红利窗口期，倒逼人口数量红利向质量红利加速转型"}, {"k": "C", "v": "彻底消除劳动力就业压力"}, {"k": "D", "v": "降低对劳动者素质的发展要求"}], "a": "B", "at": "B. 缩短红利窗口期，倒逼人口数量红利向质量红利加速转型", "note": "赶超式发展使劳动力成本优势更快消失、红利窗口期被压缩，倒逼人口数量红利加速向人口质量红利转型。"}, {"id": "12", "sec": "第三讲", "type": "单选题", "q": "中国式现代化进程中，我国人口结构调整区别于西方的独特特征是受到（ ）", "options": [{"k": "A", "v": "行政与市场的双重干预"}, {"k": "B", "v": "政府与企业的双向主导"}, {"k": "C", "v": "城市与乡村的自然调节"}, {"k": "D", "v": "家庭与社会的自主调控"}], "a": "A", "at": "A. 行政与市场的双重干预", "note": "西方人口转型基本由市场自发调节；我国人口结构转变既受计划生育等行政政策干预，又受市场化流动影响，是行政与市场双重干预的结果。"}, {"id": "13", "sec": "第三讲", "type": "单选题", "q": "以下哪项属于我国人口现代化发展的深层次矛盾（ ）", "options": [{"k": "A", "v": "人口总量过少与发展需求过大的矛盾"}, {"k": "B", "v": "社会负担加重与居民富裕程度不足的矛盾"}, {"k": "C", "v": "自然资源过剩与开发不足的矛盾"}, {"k": "D", "v": "产业升级缓慢与劳动力短缺的矛盾"}], "a": "B", "at": "B. 社会负担加重与居民富裕程度不足的矛盾", "note": "我国面临\"未富先老\"的深层次矛盾：老龄化使社会负担加重，而居民富裕程度尚不足以支撑，即社会负担加重与富裕程度不足的矛盾。"}, {"id": "14", "sec": "第三讲", "type": "单选题", "q": "我国化石能源发展面临的发展困境是（ ）", "options": [{"k": "A", "v": "完全自给自足，无外部依赖"}, {"k": "B", "v": "进口依赖度高、议价能力弱，受国际局势影响显著"}, {"k": "C", "v": "能源消耗无刚性需求，可随意调控"}, {"k": "D", "v": "能源结构无需优化升级"}], "a": "B", "at": "B. 进口依赖度高、议价能力弱，受国际局势影响显著", "note": "我国石油、天然气等化石能源对外依存度高，进口渠道集中、议价能力不足，能源安全易受国际局势冲击。"}, {"id": "15", "sec": "第三讲", "type": "单选题", "q": "我国经济现代化推进过程中，能源发展面临的双重压力是（ ）", "options": [{"k": "A", "v": "居民生活水平提升与降低经济增长耗能"}, {"k": "B", "v": "能源过剩与进口不足的双重压力"}, {"k": "C", "v": "技术先进与转型动力不足的双重压力"}, {"k": "D", "v": "内需不足与外销受阻的双重压力"}], "a": "A", "at": "A. 居民生活水平提升与降低经济增长耗能", "note": "一方面居民生活水平提升带来能源消费刚性增长，另一方面又要降低经济增长的能耗强度、实现\"双碳\"目标，二者构成能源发展的双重压力。"}, {"id": "16", "sec": "第三讲", "type": "单选题", "q": "西方救济福利模式的核心代表国家是（ ）", "options": [{"k": "A", "v": "美国"}, {"k": "B", "v": "瑞典"}, {"k": "C", "v": "德国"}, {"k": "D", "v": "希腊"}], "a": "A", "at": "A. 美国", "note": "以美国为代表的\"补救型／救济型\"福利模式强调市场化与选择性救助，福利覆盖面窄、水平低，是救济福利模式的核心代表。"}, {"id": "17", "sec": "第三讲", "type": "单选题", "q": "西方普遍福利模式的典型代表是（ ）", "options": [{"k": "A", "v": "美国"}, {"k": "B", "v": "北欧福利国家"}, {"k": "C", "v": "南欧国家"}, {"k": "D", "v": "东亚国家"}], "a": "B", "at": "B. 北欧福利国家", "note": "以瑞典等为代表的北欧国家实行\"从摇篮到坟墓\"的高福利普遍覆盖模式，是普遍福利模式的典型代表。"}, {"id": "18", "sec": "第三讲", "type": "单选题", "q": "新发展阶段缓冲劳动挤出压力、稳定就业的重要举措是（ ）", "options": [{"k": "A", "v": "打造县域经济新板块"}, {"k": "B", "v": "全面扩大能源进口规模"}, {"k": "C", "v": "弱化职业技能教育"}, {"k": "D", "v": "收缩国土开发空间"}], "a": "A", "at": "A. 打造县域经济新板块", "note": "打造县域经济新板块可以就地吸纳就业、缓冲产业外移和技术性替代对劳动力的挤出压力，是稳定就业的重要举措。"}, {"id": "19", "sec": "第三讲", "type": "单选题", "q": "实现人口质量红利、支撑人口高质量发展的基础是（ ）", "options": [{"k": "A", "v": "人口规模持续扩大"}, {"k": "B", "v": "教育体系的完善与技能人才培育"}, {"k": "C", "v": "产业大规模外移"}, {"k": "D", "v": "全面放松生育管控"}], "a": "B", "at": "B. 教育体系的完善与技能人才培育", "note": "人口质量红利依靠劳动者素质提升，其基础是完善的教育体系和技能人才培养。"}, {"id": "20", "sec": "第三讲", "type": "单选题", "q": "在人口规模优势转向人口质量优势阶段，要素流动的核心特征是（ ）", "options": [{"k": "A", "v": "城乡双向多元要素交互融通"}, {"k": "B", "v": "\"乡—城\"劳动力要素单向流动"}, {"k": "C", "v": "城市资本、技术单向流出"}, {"k": "D", "v": "区域要素完全封闭流动"}], "a": "A", "at": "A. 城乡双向多元要素交互融通", "note": "在自强式现代化经济循环演进中，要素流动从高增长阶段\"乡—城\"单向流动，逐步转向城乡双向、多元要素交互融通。"}, {"id": "21", "sec": "第三讲", "type": "多选题", "q": "人口规模巨大的现代化\"大有大的难处\"，具体体现在（ ）", "options": [{"k": "A", "v": "世界上没有先例可循，艰巨性和复杂性前所未有"}, {"k": "B", "v": "面临更强的资源环境约束"}, {"k": "C", "v": "基本公共服务压力大"}, {"k": "D", "v": "现代化建设的要素保障面临严峻压力"}], "a": "ABCD", "at": "A. 世界上没有先例可循，艰巨性和复杂性前所未有；B. 面临更强的资源环境约束；C. 基本公共服务压力大；D. 现代化建设的要素保障面临严峻压力", "note": "四项均为\"大有大的难处\"的体现：无先例可循、资源环境约束更紧、基本公共服务压力大、要素保障承压，全选。"}, {"id": "22", "sec": "第三讲", "type": "多选题", "q": "习近平总书记指出，推进人口规模巨大的现代化要始终从国情出发，做到（ ）", "options": [{"k": "A", "v": "既不好高骛远"}, {"k": "B", "v": "也不因循守旧"}, {"k": "C", "v": "保持历史耐心"}, {"k": "D", "v": "坚持稳中求进、循序渐进、持续推进"}], "a": "ABCD", "at": "A. 既不好高骛远；B. 也不因循守旧；C. 保持历史耐心；D. 坚持稳中求进、循序渐进、持续推进", "note": "四项均为总书记关于从国情出发推进人口规模巨大现代化的原话要点，全选。"}, {"id": "23", "sec": "第三讲", "type": "多选题", "q": "人口规模巨大\"大也有大的优势\"，从供给端与需求端来看，具体体现为（ ）", "options": [{"k": "A", "v": "近 9 亿劳动力，技能人才总量超 2 亿人"}, {"k": "B", "v": "拥有 14 亿多人口、4 亿多中等收入群体"}, {"k": "C", "v": "人均国内生产总值超过 1.3 万美元"}, {"k": "D", "v": "形成超大规模市场和超大经济体量"}], "a": "ABCD", "at": "A. 近 9 亿劳动力，技能人才总量超 2 亿人；B. 拥有 14 亿多人口、4 亿多中等收入群体；C. 人均国内生产总值超过 1.3 万美元；D. 形成超大规模市场和超大经济体量", "note": "供给端是近 9 亿劳动力、超 2 亿技能人才（A），需求端是 14 亿多人口、4 亿多中等收入群体支撑的超大规模市场（B、D），人均 GDP 超 1.3 万美元体现规模效应下人均水平的提升（C），全选。"}, {"id": "24", "sec": "第三讲", "type": "多选题", "q": "当前我国人口发展呈现的趋势性特征包括（ ）", "options": [{"k": "A", "v": "少子化"}, {"k": "B", "v": "老龄化"}, {"k": "C", "v": "区域人口增减分化"}, {"k": "D", "v": "人口总量高速增长"}], "a": "ABC", "at": "A. 少子化；B. 老龄化；C. 区域人口增减分化", "note": "少子化、老龄化、区域人口增减分化是三大趋势性特征；我国人口总量已负增长，D 错误。"}, {"id": "25", "sec": "第三讲", "type": "多选题", "q": "习近平总书记提出，新时代人口工作要加快塑造怎样的现代化人力资源（ ）", "options": [{"k": "A", "v": "素质优良"}, {"k": "B", "v": "总量充裕"}, {"k": "C", "v": "结构优化"}, {"k": "D", "v": "分布合理"}], "a": "ABCD", "at": "A. 素质优良；B. 总量充裕；C. 结构优化；D. 分布合理", "note": "新时代人口工作的目标是塑造素质优良、总量充裕、结构优化、分布合理的现代化人力资源，全选。"}, {"id": "26", "sec": "第三讲", "type": "多选题", "q": "人口规模巨大映射出中国式现代化进程中的深层次矛盾包括（ ）", "options": [{"k": "A", "v": "赶超发展与人口红利转型的矛盾"}, {"k": "B", "v": "社会负担加重与富裕程度不足的矛盾"}, {"k": "C", "v": "能源进口依赖与刚性需求持续的矛盾"}, {"k": "D", "v": "人口总量过剩与劳动力短缺的矛盾"}], "a": "ABC", "at": "A. 赶超发展与人口红利转型的矛盾；B. 社会负担加重与富裕程度不足的矛盾；C. 能源进口依赖与刚性需求持续的矛盾", "note": "赶超发展压缩红利窗口期、\"未富先老\"的负担与富裕矛盾、能源对外依赖与需求刚性持续是三大深层次矛盾；D 项表述不成立。"}, {"id": "27", "sec": "第三讲", "type": "多选题", "q": "与其他国家相比，产业外移和技术性挤出对我国就业冲击更强的原因有（ ）", "options": [{"k": "A", "v": "赶超发展使得冲击大大提前"}, {"k": "B", "v": "人口整体规模巨大"}, {"k": "C", "v": "劳动力素质普遍过高"}, {"k": "D", "v": "劳动替代比例更高"}], "a": "ABD", "at": "A. 赶超发展使得冲击大大提前；B. 人口整体规模巨大；D. 劳动替代比例更高", "note": "赶超使冲击提前到来、庞大劳动力基数放大受影响面、劳动替代比例更高，三者叠加使冲击更强；C 与事实不符。"}, {"id": "28", "sec": "第三讲", "type": "多选题", "q": "与处于同等发展阶段的日本、韩国相比，关于中国，以下说法正确的是（ ）", "options": [{"k": "A", "v": "社会负担更重"}, {"k": "B", "v": "人口自然增长率更高"}, {"k": "C", "v": "居民整体财富水平更低"}, {"k": "D", "v": "居民可支配收入更高"}], "a": "AC", "at": "A. 社会负担更重；C. 居民整体财富水平更低", "note": "以服务业占比对标同等发展阶段，中国\"未富先老\"，社会抚养负担更重、居民整体财富水平更低；B、D 与事实相反。"}, {"id": "29", "sec": "第三讲", "type": "多选题", "q": "我国化石能源进口的主要特点有（ ）", "options": [{"k": "A", "v": "进口规模大"}, {"k": "B", "v": "进口渠道集中"}, {"k": "C", "v": "议价能力不足"}, {"k": "D", "v": "受国际局势影响较大"}], "a": "ABCD", "at": "A. 进口规模大；B. 进口渠道集中；C. 议价能力不足；D. 受国际局势影响较大", "note": "四项均是我国化石能源（石油、天然气等）进口的主要特点，构成能源安全风险来源，全选。"}, {"id": "30", "sec": "第三讲", "type": "多选题", "q": "打造县域经济新板块的具体实施路径包括（ ）", "options": [{"k": "A", "v": "以产业基础设施建设为先导"}, {"k": "B", "v": "优化县域营商环境改革"}, {"k": "C", "v": "完善县域公共服务与社会保障体系"}, {"k": "D", "v": "全面取消县域产业准入限制"}], "a": "ABC", "at": "A. 以产业基础设施建设为先导；B. 优化县域营商环境改革；C. 完善县域公共服务与社会保障体系", "note": "县域经济新板块依托产业基础设施先行、营商环境优化、公共服务与社保完善来承接就业与产业；D 项\"全面取消产业准入限制\"表述错误。"}, {"id": "31", "sec": "第三讲", "type": "多选题", "q": "拓宽国土开发空间、激活生物能源供应的具体措施有（ ）", "options": [{"k": "A", "v": "将调水工程建设与土壤改造技术相结合"}, {"k": "B", "v": "利用新增土地推广生物能源技术"}, {"k": "C", "v": "充分发挥新开发土地的资产效应"}, {"k": "D", "v": "放开耕地非农化限制以扩大建设用地"}], "a": "ABC", "at": "A. 将调水工程建设与土壤改造技术相结合；B. 利用新增土地推广生物能源技术；C. 充分发挥新开发土地的资产效应", "note": "通过调水工程＋土壤改造拓展可利用国土，在新增土地上推广生物能源并发挥其资产效应；D 项违背耕地保护红线，错误。"}, {"id": "32", "sec": "第三讲", "type": "判断题", "q": "中国式现代化所承载的人口数量超过了现有发达国家的人口总和。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "现有发达国家人口总和不到 10 亿，而中国是 14 亿多人口整体迈入现代化，超过了现有发达国家人口的总和。"}, {"id": "33", "sec": "第三讲", "type": "判断题", "q": "中国式现代化是人口规模巨大的现代化，14 亿多人口整体迈入现代化将彻底改写现代化的世界版图。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "14 亿多人口整体迈入现代化，其规模超过现有发达国家人口总和，将彻底改写现代化的世界版图。"}, {"id": "34", "sec": "第三讲", "type": "判断题", "q": "\"再大的成就乘以 14 亿都会变得很大，再小的问题除以 14 亿都会变得很小\"，这是对我国人口规模巨大国情的准确理解。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "正确表述应为\"再小的问题除以 14 亿都会变得很大\"。任何小问题乘以庞大人口基数都会被放大，题干后半句\"变得很小\"曲解了人口国情的含义。"}, {"id": "35", "sec": "第三讲", "type": "判断题", "q": "庞大的人口基数背后是不同地区、行业、群体的差异化利益诉求，因此我国现代化建设必须考虑城乡区域发展水平差异大的实际。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "人口规模巨大伴随地区、行业、群体间的差异，现代化建设必须正视并统筹城乡区域发展水平差异大的实际。"}, {"id": "36", "sec": "第三讲", "type": "判断题", "q": "超大规模经济体必须以外部大循环为主，将发展主导权融入全球市场体系。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "超大规模经济体的核心要求是内部可循环、以国内大循环为主体，牢牢把握发展主导权，而非依赖外部循环。"}, {"id": "37", "sec": "第三讲", "type": "判断题", "q": "中国人口结构转型是完全在市场机制调节下自发完成的，与行政政策干预无关。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "我国人口结构转型受计划生育等行政政策与市场机制的双重干预，区别于西方的市场自发调节。"}, {"id": "38", "sec": "第三讲", "type": "判断题", "q": "以服务业占比为对标，在相同发展阶段下，中国的社会抚养负担低于日本和韩国，居民富裕程度也整体更高。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "与同等发展阶段的日本、韩国相比，中国社会抚养负担更重、居民富裕程度整体更低，即\"未富先老\"，题干表述正好相反。"}, {"id": "39", "sec": "第三讲", "type": "判断题", "q": "西方的救济福利与普遍福利两种模式，从根本上都是为资本主义发展服务而建构的。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "无论美国式救济福利还是北欧式普遍福利，都是资本主义制度框架内服务于资本再生产与社会稳定的安排，本质上为资本主义发展服务。"}, {"id": "40", "sec": "第三讲", "type": "判断题", "q": "在自强式现代化经济循环的演进中，国内要素流动从高增长阶段的城乡双向多元融通，逐步转向\"乡—城\"劳动力要素单向流动。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "方向说反了：要素流动是从高增长阶段\"乡—城\"的单向流动，逐步转向城乡双向多元要素交互融通。"}, {"id": "1", "sec": "第四讲", "type": "单选题", "q": "共同富裕是（ ）的本质要求。", "options": [{"k": "A", "v": "资本主义"}, {"k": "B", "v": "社会主义"}, {"k": "C", "v": "封建主义"}], "a": "B", "at": "B. 社会主义", "note": "共同富裕是社会主义的本质要求，是社会主义区别于资本主义的根本标志。"}, {"id": "2", "sec": "第四讲", "type": "单选题", "q": "共同富裕要分阶段推进，不是（ ）。", "options": [{"k": "A", "v": "久久为功"}, {"k": "B", "v": "一蹴而就"}, {"k": "C", "v": "循序渐进"}], "a": "B", "at": "B. 一蹴而就", "note": "共同富裕是长期历史过程，要分阶段、循序渐进、久久为功地推进，不可能一蹴而就。"}, {"id": "3", "sec": "第四讲", "type": "单选题", "q": "马克思和恩格斯认为，（ ）是资本主义剥削的根源。", "options": [{"k": "A", "v": "私有制"}, {"k": "B", "v": "生产力不足"}, {"k": "C", "v": "分配不公"}], "a": "A", "at": "A. 私有制", "note": "马恩认为生产资料私有制是资本主义剥削的根源，消灭私有制才能消灭剥削。"}, {"id": "4", "sec": "第四讲", "type": "单选题", "q": "马克思指出，生产的最终归宿是（ ）。", "options": [{"k": "A", "v": "资本积累"}, {"k": "B", "v": "人的全面发展和所有人的共同富裕"}, {"k": "C", "v": "竞争胜利"}], "a": "B", "at": "B. 人的全面发展和所有人的共同富裕", "note": "马克思指出，未来社会生产将以所有的人富裕为目的，生产的最终归宿是人的全面发展和所有人的共同富裕。"}, {"id": "5", "sec": "第四讲", "type": "单选题", "q": "恩格斯指出，决定分配的是（ ）。", "options": [{"k": "A", "v": "生产"}, {"k": "B", "v": "消费"}, {"k": "C", "v": "交换"}], "a": "A", "at": "A. 生产", "note": "恩格斯指出，分配方式本质上取决于可分配的产品数量，而产品数量取决于生产，即生产决定分配。"}, {"id": "6", "sec": "第四讲", "type": "单选题", "q": "恩格斯在《反杜林论》指出，共产主义社会的分配制度是（ ）。", "options": [{"k": "A", "v": "按资分配"}, {"k": "B", "v": "各尽所能，按劳分配"}, {"k": "C", "v": "各尽所能，按需分配"}], "a": "C", "at": "C. 各尽所能，按需分配", "note": "恩格斯在《反杜林论》中指出，共产主义社会实行\"各尽所能、按需分配\"。"}, {"id": "7", "sec": "第四讲", "type": "单选题", "q": "中华传统文化将（ ）视为治国安邦的核心。", "options": [{"k": "A", "v": "富民"}, {"k": "B", "v": "征伐"}, {"k": "C", "v": "严刑峻法"}], "a": "A", "at": "A. 富民", "note": "中华传统文化历来把富民安民作为治国安邦的核心，如\"民惟邦本，本固邦宁\"。"}, {"id": "8", "sec": "第四讲", "type": "单选题", "q": "习近平同志指出，（ ）是最大政绩。", "options": [{"k": "A", "v": "经济增长"}, {"k": "B", "v": "财政收入"}, {"k": "C", "v": "为民造福"}], "a": "C", "at": "C. 为民造福", "note": "习近平总书记强调，为民造福是最大政绩。"}, {"id": "9", "sec": "第四讲", "type": "单选题", "q": "新时代，习近平总书记将共同富裕提升到（ ）高度。", "options": [{"k": "A", "v": "前所未有的战略"}, {"k": "B", "v": "一般工作"}, {"k": "C", "v": "局部探索"}], "a": "A", "at": "A. 前所未有的战略", "note": "新时代党中央把共同富裕提升到前所未有的战略高度，扎实推动共同富裕。"}, {"id": "10", "sec": "第四讲", "type": "单选题", "q": "共享发展理念体现的是（ ）的要求。", "options": [{"k": "A", "v": "平均分配"}, {"k": "B", "v": "逐步实现共同富裕"}, {"k": "C", "v": "先富后富"}], "a": "B", "at": "B. 逐步实现共同富裕", "note": "共享发展理念内涵之一就是共享是共建共享、全民共享、全面共享、渐进共享，体现逐步实现共同富裕的要求。"}, {"id": "11", "sec": "第四讲", "type": "单选题", "q": "贫困是共同富裕的（ ）。", "options": [{"k": "A", "v": "最大短板"}, {"k": "B", "v": "次要问题"}, {"k": "C", "v": "无关因素"}], "a": "A", "at": "A. 最大短板", "note": "贫困是实现共同富裕的最大短板，消除绝对贫困是迈向共同富裕的关键一步。"}, {"id": "12", "sec": "第四讲", "type": "单选题", "q": "党的十八大以来，我国经济社会发展取得历史性成就，但（ ）问题仍然突出。", "options": [{"k": "A", "v": "发展不平衡不充分"}, {"k": "B", "v": "城乡收入差距"}, {"k": "C", "v": "区域发展滞后"}], "a": "A", "at": "A. 发展不平衡不充分", "note": "我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，发展不平衡不充分问题仍然突出。"}, {"id": "13", "sec": "第四讲", "type": "单选题", "q": "当前我国中等收入群体规模已超（ ）人。", "options": [{"k": "A", "v": "3 亿"}, {"k": "B", "v": "3.5 亿"}, {"k": "C", "v": "4 亿"}], "a": "C", "at": "C. 4 亿", "note": "我国中等收入群体规模已超过 4 亿人，形成全球规模最大的中等收入群体。"}, {"id": "14", "sec": "第四讲", "type": "单选题", "q": "到 2035 年，全体人民共同富裕将取得（ ）。", "options": [{"k": "A", "v": "基本实现"}, {"k": "B", "v": "更为明显的实质性进展"}, {"k": "C", "v": "完全实现"}], "a": "B", "at": "B. 更为明显的实质性进展", "note": "党的二十大明确，到 2035 年全体人民共同富裕取得更为明显的实质性进展。"}, {"id": "15", "sec": "第四讲", "type": "单选题", "q": "从 1978 年到 2012 年，我国的 GDP 从 3679 亿元增长到了（ ）亿元。", "options": [{"k": "A", "v": "20 万"}, {"k": "B", "v": "54 万"}, {"k": "C", "v": "100 万"}], "a": "B", "at": "B. 54 万", "note": "2012 年我国 GDP 达到约 54 万亿元，2020 年突破 100 万亿元。"}, {"id": "16", "sec": "第四讲", "type": "单选题", "q": "（ ）是民生之源。", "options": [{"k": "A", "v": "社会保障"}, {"k": "B", "v": "公共服务"}, {"k": "C", "v": "收入分配"}], "a": "C", "at": "C. 收入分配", "note": "收入分配是民生之源，是改善民生、实现发展成果由人民共享最重要最直接的方式。"}, {"id": "17", "sec": "第四讲", "type": "单选题", "q": "公共服务均等化是共同富裕的重要体现，要在加强（ ）民生建设上多办实事。", "options": [{"k": "A", "v": "系统性、整体性、协同性"}, {"k": "B", "v": "全覆盖、高质量、可持续"}, {"k": "C", "v": "基础性、普惠性、兜底性"}], "a": "C", "at": "C. 基础性、普惠性、兜底性", "note": "要加强基础性、普惠性、兜底性民生建设，健全基本公共服务体系。"}, {"id": "18", "sec": "第四讲", "type": "单选题", "q": "中国成功打赢脱贫攻坚战，提前（ ）年实现联合国 2030 年可持续发展议程减贫目标。", "options": [{"k": "A", "v": "10"}, {"k": "B", "v": "15"}, {"k": "C", "v": "20"}], "a": "A", "at": "A. 10", "note": "中国提前 10 年实现联合国 2030 年可持续发展议程的减贫目标。"}, {"id": "19", "sec": "第四讲", "type": "单选题", "q": "（ ）为实现共同富裕创造了根本政治前提。", "options": [{"k": "A", "v": "中华人民共和国的成立"}, {"k": "B", "v": "社会主义制度确立"}, {"k": "C", "v": "改革开放"}], "a": "A", "at": "A. 中华人民共和国的成立", "note": "1949 年中华人民共和国的成立为实现共同富裕创造了根本政治前提；社会主义制度确立奠定了制度基础。"}, {"id": "20", "sec": "第四讲", "type": "单选题", "q": "从改革开放后至党的十八大前，我国的共同富裕实践经历了（ ）的时期。", "options": [{"k": "A", "v": "制度奠基"}, {"k": "B", "v": "先富带后富"}, {"k": "C", "v": "历史性突破"}], "a": "B", "at": "B. 先富带后富", "note": "改革开放后至党的十八大前，我国实行\"允许一部分人先富起来、先富带动后富\"的共同富裕实践；新中国成立初期是制度奠基，新时代是历史性突破。"}, {"id": "21", "sec": "第四讲", "type": "多选题", "q": "共同富裕包含哪些内涵？（ ）", "options": [{"k": "A", "v": "平均主义"}, {"k": "B", "v": "物质富足"}, {"k": "C", "v": "精神富有"}, {"k": "D", "v": "全民共富"}], "a": "BCD", "at": "B. 物质富足；C. 精神富有；D. 全民共富", "note": "共同富裕是全民共富、物质富足与精神富有相统一，不是整齐划一的平均主义，A 错误。"}, {"id": "22", "sec": "第四讲", "type": "多选题", "q": "推进共同富裕时，以下哪些做法是正确的？（ ）", "options": [{"k": "A", "v": "鼓励勤劳创新致富"}, {"k": "B", "v": "畅通向上流动通道"}, {"k": "C", "v": "让每个人公平享有发展机会"}, {"k": "D", "v": "要脚踏实地、久久为功"}], "a": "ABCD", "at": "A. 鼓励勤劳创新致富；B. 畅通向上流动通道；C. 让每个人公平享有发展机会；D. 要脚踏实地、久久为功", "note": "四项均为推进共同富裕的正确做法：鼓励勤劳创新致富、畅通向上流动通道、促进机会公平、坚持循序渐进久久为功。"}, {"id": "23", "sec": "第四讲", "type": "多选题", "q": "马克思恩格斯认为，建立共产主义公有制可以实现（ ）。", "options": [{"k": "A", "v": "解放生产力"}, {"k": "B", "v": "发展生产力"}, {"k": "C", "v": "社会财富共同占有"}, {"k": "D", "v": "维护私有制"}], "a": "ABC", "at": "A. 解放生产力；B. 发展生产力；C. 社会财富共同占有", "note": "建立共产主义公有制旨在解放和发展生产力、实现社会财富共同占有；D 项与公有制相悖。"}, {"id": "24", "sec": "第四讲", "type": "多选题", "q": "中华优秀传统文化中强调的共同富裕思想包括（ ）。", "options": [{"k": "A", "v": "富民为本"}, {"k": "B", "v": "分配均平"}, {"k": "C", "v": "绝对平均"}, {"k": "D", "v": "仁爱共享"}], "a": "ABD", "at": "A. 富民为本；B. 分配均平；D. 仁爱共享", "note": "富民为本、分配均平、仁爱共享均为传统文化中的共同富裕思想；C 项\"绝对平均\"不是传统文化主张，也与共同富裕有本质区别。"}, {"id": "25", "sec": "第四讲", "type": "多选题", "q": "以下属于新时代我国民生保障体系建设成就的有（ ）。", "options": [{"k": "A", "v": "建成世界最大社会保障网"}, {"k": "B", "v": "建成全球最大蒸汽铁路网"}, {"k": "C", "v": "基本养老保险参保人数达 10.7 亿"}, {"k": "D", "v": "基本医疗保险参保人数达 13.3 亿"}], "a": "ACD", "at": "A. 建成世界最大社会保障网；C. 基本养老保险参保人数达 10.7 亿；D. 基本医疗保险参保人数达 13.3 亿", "note": "我国建成世界上规模最大的社会保障网，基本养老保险参保 10.7 亿人、基本医疗保险参保 13.3 亿人；B 项\"蒸汽铁路网\"表述错误（我国建成的是全球最大高速铁路网）。"}, {"id": "26", "sec": "第四讲", "type": "多选题", "q": "新时代我国在共同富裕领域取得的成就有（ ）。", "options": [{"k": "A", "v": "历史性解决绝对贫困"}, {"k": "B", "v": "居民收入持续增长"}, {"k": "C", "v": "公共服务水平不断提升"}, {"k": "D", "v": "贫富差距持续扩大"}], "a": "ABC", "at": "A. 历史性解决绝对贫困；B. 居民收入持续增长；C. 公共服务水平不断提升", "note": "绝对贫困历史性解决、居民收入持续增长、公共服务水平不断提升是新时代共同富裕领域的主要成就；D 项与事实相反。"}, {"id": "27", "sec": "第四讲", "type": "多选题", "q": "我国收入分配制度体系包括（ ）。", "options": [{"k": "A", "v": "初次分配"}, {"k": "B", "v": "再分配"}, {"k": "C", "v": "最终分配"}, {"k": "D", "v": "三次分配"}], "a": "ABD", "at": "A. 初次分配；B. 再分配；D. 三次分配", "note": "我国收入分配制度体系由初次分配、再分配、三次分配协调配套构成；\"最终分配\"不是规范表述。"}, {"id": "28", "sec": "第四讲", "type": "多选题", "q": "相比于西方现代化的道路，中国走出了一条（ ）的共同富裕道路。", "options": [{"k": "A", "v": "以人民为中心"}, {"k": "B", "v": "注重平衡协调"}, {"k": "C", "v": "先污染后治理、先富裕后公平"}, {"k": "D", "v": "强调共建共享"}], "a": "ABD", "at": "A. 以人民为中心；B. 注重平衡协调；D. 强调共建共享", "note": "中国式现代化坚持人民至上、平衡协调、共建共享，避免西方\"先污染后治理、先富裕后公平\"的老路，C 项属于西方道路的特征。"}, {"id": "29", "sec": "第四讲", "type": "多选题", "q": "中国的共同富裕实践为世界带来的价值有（ ）。", "options": [{"k": "A", "v": "助力全球减贫事业"}, {"k": "B", "v": "为发展中国家提供新的发展选择"}, {"k": "C", "v": "推动构建人类命运共同体"}, {"k": "D", "v": "丰富了人类文明新形态的内涵"}], "a": "ABCD", "at": "A. 助力全球减贫事业；B. 为发展中国家提供新的发展选择；C. 推动构建人类命运共同体；D. 丰富了人类文明新形态的内涵", "note": "四项均为中国共同富裕实践的世界意义，全选。"}, {"id": "30", "sec": "第四讲", "type": "多选题", "q": "推动区域协调发展转型升级需要做到（ ）。", "options": [{"k": "A", "v": "只发展东部沿海地区"}, {"k": "B", "v": "推进产业国内梯度转移"}, {"k": "C", "v": "深化区域对口帮扶协作"}, {"k": "D", "v": "优化城镇化战略格局"}], "a": "BCD", "at": "B. 推进产业国内梯度转移；C. 深化区域对口帮扶协作；D. 优化城镇化战略格局", "note": "推动区域协调发展要推进产业梯度转移、深化对口帮扶协作、优化城镇化战略格局；A 项违背区域协调发展要求。"}, {"id": "31", "sec": "第四讲", "type": "判断题", "q": "1956 年我国基本完成社会主义改造。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "1956 年底三大改造基本完成，标志着社会主义基本制度在我国确立。"}, {"id": "32", "sec": "第四讲", "type": "判断题", "q": "中国建成了世界最大教育体系。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "我国建成世界上规模最大的教育体系，各级教育普及程度达到或超过中高收入国家平均水平。"}, {"id": "33", "sec": "第四讲", "type": "判断题", "q": "共同富裕是整齐划一的平均主义。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "共同富裕不是整齐划一的平均主义，允许存在合理差距，分阶段渐进实现。"}, {"id": "34", "sec": "第四讲", "type": "判断题", "q": "西方式现代化不会造成生态破坏与贫富分化。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "西方现代化走的是\"先污染后治理、先富裕后公平\"的道路，伴随着生态破坏与贫富两极分化。"}, {"id": "35", "sec": "第四讲", "type": "判断题", "q": "胡锦涛同志提出\"效率优先，兼顾公平\"的分配原则。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "\"效率优先、兼顾公平\"是党的十四届三中全会提出的；胡锦涛同志在党的十七大提出的是\"初次分配和再分配都要处理好效率和公平的关系，再分配更加注重公平\"。"}, {"id": "36", "sec": "第四讲", "type": "判断题", "q": "湖南省湘西花垣县十八洞村是\"精准扶贫\"理念首倡地。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "2013 年 11 月，习近平总书记在十八洞村首次提出\"精准扶贫\"重要理念。"}, {"id": "37", "sec": "第四讲", "type": "判断题", "q": "浙江是全国唯一的共同富裕示范区，其建设成效表明该省已经实现了共同富裕。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "浙江确实是全国首个（唯一的）共同富裕示范区，但示范区仍在建设之中，不能说\"已经实现共同富裕\"。"}, {"id": "38", "sec": "第四讲", "type": "判断题", "q": "中国推动共建一带一路高质量发展是共同富裕理念的践行。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "共建\"一带一路\"坚持共商共建共享，推动沿线国家共同发展，是共同富裕理念在国际层面的践行。"}, {"id": "39", "sec": "第四讲", "type": "判断题", "q": "马克思恩格斯在《共产党宣言》中明确提出\"共同富裕\"这一概念。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "马恩在《共产党宣言》等著作中阐述了共同富裕的思想（如\"生产将以所有的人富裕为目的\"），但并未明确提出\"共同富裕\"这一概念，该概念由我们党在领导实践中逐步提出。"}, {"id": "40", "sec": "第四讲", "type": "判断题", "q": "实现共同富裕需要加快高水平科技自立自强，引领新质生产力发展。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "实现共同富裕要做大\"蛋糕\"，需要加快高水平科技自立自强，以新质生产力引领高质量发展。"}, {"id": "1", "sec": "第五讲", "type": "单选题", "q": "关于中国式现代化，下列认识正确的是（ ）。", "options": [{"k": "A", "v": "物质文明和精神文明相互独立"}, {"k": "B", "v": "重点抓精神文明兼顾物质文明"}, {"k": "C", "v": "物质文明和精神文明相协调"}, {"k": "D", "v": "只需抓好精神文明建设，物质文明自然就会发展"}], "a": "C", "at": "C. 物质文明和精神文明相协调", "note": "中国式现代化是物质文明和精神文明相协调的现代化，两者相互促进、不可偏废。"}, {"id": "2", "sec": "第五讲", "type": "单选题", "q": "习近平总书记在新年贺词中点赞贵州\"村超\"\"活力四射\"，这是因为\"村超\"（ ）。", "options": [{"k": "A", "v": "是中国规模最大、竞技水平最高的足球赛事"}, {"k": "B", "v": "不仅提升了人民物质生活水平，又丰富了人民的精神世界"}, {"k": "C", "v": "以职业化运营模式带动了当地体育产业快速发展"}, {"k": "D", "v": "以政府为主导，由国际足联派驻专业团队策划"}], "a": "B", "at": "B. 不仅提升了人民物质生活水平，又丰富了人民的精神世界", "note": "\"村超\"既带动了当地旅游与消费、提升了群众物质生活水平，又丰富了人民精神世界，是物质文明和精神文明协调发展的生动写照。"}, {"id": "3", "sec": "第五讲", "type": "单选题", "q": "在新民主主义革命时期，毛泽东提出要把一个被旧文化统治因而愚昧落后的中国，变为一个（ ）的中国。", "options": [{"k": "A", "v": "军事力量强大"}, {"k": "B", "v": "被新文化统治因而文明先进"}, {"k": "C", "v": "纯粹经济繁荣"}, {"k": "D", "v": "纯粹政治自由"}], "a": "B", "at": "B. 被新文化统治因而文明先进", "note": "毛泽东在《新民主主义论》中提出，要把被旧文化统治因而愚昧落后的中国，变为被新文化统治因而文明先进的中国。"}, {"id": "4", "sec": "第五讲", "type": "单选题", "q": "新中国成立后，毛泽东提出新政府将领导全国人民进行大规模的经济建设和（ ）。", "options": [{"k": "A", "v": "军事建设"}, {"k": "B", "v": "文化建设"}, {"k": "C", "v": "法制建设"}, {"k": "D", "v": "外交建设"}], "a": "B", "at": "B. 文化建设", "note": "新中国成立后，毛泽东提出将领导全国人民进行大规模的经济建设和文化建设，扫除旧中国遗留下来的贫困和愚昧。"}, {"id": "5", "sec": "第五讲", "type": "单选题", "q": "下列哪一项不是文化事业的核心特征（ ）。", "options": [{"k": "A", "v": "公益性"}, {"k": "B", "v": "便利性"}, {"k": "C", "v": "营利性"}, {"k": "D", "v": "均等性"}], "a": "C", "at": "C. 营利性", "note": "文化事业以公共财政为支撑，核心特征是公益性、基本性、均等性、便利性；营利性是文化产业的市场属性。"}, {"id": "6", "sec": "第五讲", "type": "单选题", "q": "习近平总书记提出两道\"融合命题\"，其中之一是要求推进（ ）深度融合，把自然风光和人文风情转化为旅游业的持久魅力。", "options": [{"k": "A", "v": "文化和科技"}, {"k": "B", "v": "文化和旅游"}, {"k": "C", "v": "文化和体育"}, {"k": "D", "v": "文化和农业"}], "a": "B", "at": "B. 文化和旅游", "note": "两道\"融合命题\"：一是推进文化和科技融合，二是推进文化和旅游融合，把自然风光和人文风情转化为旅游业持久魅力。"}, {"id": "7", "sec": "第五讲", "type": "单选题", "q": "关于坚持文化惠民，提升公共文化服务水平，下列认识错误的是（ ）。", "options": [{"k": "A", "v": "公共文化服务是维护好、发展好人民基本文化权益的主要途径"}, {"k": "B", "v": "提升公共文化服务水平应采取\"一刀切\"的模式，统一配置文化资源"}, {"k": "C", "v": "各地应因地制宜构建文化生活圈，依托自身资源禀赋打造公共文化新空间"}, {"k": "D", "v": "\"村晚\"作为群众性文化活动，既展示了乡村文化，也推动了乡村振兴"}], "a": "B", "at": "B. 提升公共文化服务水平应采取\"一刀切\"的模式，统一配置文化资源", "note": "公共文化服务应因地制宜、精准供给，\"一刀切\"统一配置的做法是错误的。"}, {"id": "8", "sec": "第五讲", "type": "单选题", "q": "探索文化和科技融合的有效机制，是因为（ ）。", "options": [{"k": "A", "v": "人工智能技术已经能够完全取代人类进行文化创作"}, {"k": "B", "v": "文化与科技融合的主要目的是减少文化产业的从业人员数量"}, {"k": "C", "v": "科技是文化发展的唯一动力"}, {"k": "D", "v": "文化和科技深度融合能够催生新业态，形成新的文化产业增长点"}], "a": "D", "at": "D. 文化和科技深度融合能够催生新业态，形成新的文化产业增长点", "note": "文化和科技深度融合催生文化新业态、新模式，形成新的文化产业增长点。"}, {"id": "9", "sec": "第五讲", "type": "单选题", "q": "关于推动社会主义文化繁荣发展，下列认识正确的是（ ）。", "options": [{"k": "A", "v": "推动文化繁荣发展，只需抓好文化产业，文化事业可以弱化"}, {"k": "B", "v": "创作无愧于时代的精品力作，要以市场为唯一导向"}, {"k": "C", "v": "创作无愧于时代的精品力作，必须坚持以人民为中心"}, {"k": "D", "v": "文化与科技、文化与旅游是各自独立发展的领域，无需相互融合"}], "a": "C", "at": "C. 创作无愧于时代的精品力作，必须坚持以人民为中心", "note": "文艺创作必须坚持以人民为中心的创作导向；文化事业与文化产业要协调发展，融合是必然趋势。"}, {"id": "10", "sec": "第五讲", "type": "单选题", "q": "中国在新时代新的文化使命是什么？（ ）", "options": [{"k": "A", "v": "只发展国内传统民间艺术"}, {"k": "B", "v": "继续推动文化繁荣、建设文化强国、建设中华民族现代文明"}, {"k": "C", "v": "单纯对外输出文化产品以获取经济利益"}, {"k": "D", "v": "封闭本土文化，隔绝外来文明"}], "a": "B", "at": "B. 继续推动文化繁荣、建设文化强国、建设中华民族现代文明", "note": "新时代新的文化使命是：在新的起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明。"}, {"id": "11", "sec": "第五讲", "type": "单选题", "q": "以下哪句话表达了中华文明开放包容的特质？（ ）", "options": [{"k": "A", "v": "罗马不是一天建成的"}, {"k": "B", "v": "一朵鲜花打扮不出美丽的春天，百花齐放才能让世界春色满园"}, {"k": "C", "v": "熟能生巧"}, {"k": "D", "v": "眼见为实"}], "a": "B", "at": "B. 一朵鲜花打扮不出美丽的春天，百花齐放才能让世界春色满园", "note": "\"一朵鲜花打扮不出美丽的春天，百花齐放才能让世界春色满园\"强调文明多样性，体现中华文明开放包容的特质。"}, {"id": "12", "sec": "第五讲", "type": "单选题", "q": "以下哪一项不属于文中提及的人类文明发展面临的三大困境？（ ）", "options": [{"k": "A", "v": "经济发展乏力"}, {"k": "B", "v": "政治动荡不断加剧"}, {"k": "C", "v": "全球人口快速激增"}, {"k": "D", "v": "文化纷争频繁出现"}], "a": "C", "at": "C. 全球人口快速激增", "note": "三大困境是经济发展乏力、政治动荡不断加剧、文化纷争频繁出现；\"全球人口快速激增\"不属于其中。"}, {"id": "13", "sec": "第五讲", "type": "单选题", "q": "70 多年来中国对世界经济增长的贡献率约为多少？（ ）", "options": [{"k": "A", "v": "15%"}, {"k": "B", "v": "30%"}, {"k": "C", "v": "50%"}, {"k": "D", "v": "60%"}], "a": "B", "at": "B. 30%", "note": "70 多年来中国对世界经济增长的平均贡献率约达 30%，是全球经济增长的重要引擎。"}, {"id": "14", "sec": "第五讲", "type": "单选题", "q": "在\"一带一路\"国际合作的各类项目中，中国与乌兹别克斯坦联合修缮的是哪座古城？（ ）", "options": [{"k": "A", "v": "撒马尔罕"}, {"k": "B", "v": "布哈拉"}, {"k": "C", "v": "希瓦古城"}, {"k": "D", "v": "塔什干"}], "a": "C", "at": "C. 希瓦古城", "note": "中国与乌兹别克斯坦合作开展希瓦古城历史文化遗迹修复项目。"}, {"id": "15", "sec": "第五讲", "type": "单选题", "q": "中乌古城联合修缮项目中工程师们采用的核心修复理念是什么？（ ）", "options": [{"k": "A", "v": "全面现代化重建，让建筑焕然一新"}, {"k": "B", "v": "最小干预、预防性保护"}, {"k": "C", "v": "彻底拆除原有古建筑"}, {"k": "D", "v": "只注重建筑外观装饰"}], "a": "B", "at": "B. 最小干预、预防性保护", "note": "修复遵循国际文物保护原则，坚持\"最小干预\"和预防性保护，最大程度保留古城历史风貌。"}, {"id": "16", "sec": "第五讲", "type": "单选题", "q": "经中国提议、联合国大会决议，以下哪一天被定为文明对话国际日？（ ）", "options": [{"k": "A", "v": "6 月 10 日"}, {"k": "B", "v": "7 月 28 日"}, {"k": "C", "v": "10 月 1 日"}, {"k": "D", "v": "12 月 10 日"}], "a": "A", "at": "A. 6 月 10 日", "note": "2024 年联合国大会通过中国提议的决议，将每年 6 月 10 日设立为\"文明对话国际日\"。"}, {"id": "17", "sec": "第五讲", "type": "单选题", "q": "2025 年的哪个时间节点让中美网民在小红书上的跨境交流成为热点话题？（ ）", "options": [{"k": "A", "v": "世界大学生运动会"}, {"k": "B", "v": "春节"}, {"k": "C", "v": "国际文化节"}, {"k": "D", "v": "全球旅游峰会"}], "a": "B", "at": "B. 春节", "note": "2025 年春节前后，大批美国网民涌入小红书与中国网民互动交流，\"中美网民在小红书上对账\"成为热点话题。"}, {"id": "18", "sec": "第五讲", "type": "单选题", "q": "中国秉持怎样的理念来化解不同文明之间的矛盾冲突？（ ）", "options": [{"k": "A", "v": "文明优越论"}, {"k": "B", "v": "文明冲突论"}, {"k": "C", "v": "平等、互鉴、对话、包容的文明观"}, {"k": "D", "v": "孤立主义与保护主义"}], "a": "C", "at": "C. 平等、互鉴、对话、包容的文明观", "note": "中国倡导平等、互鉴、对话、包容的文明观，反对文明优越论和文明冲突论。"}, {"id": "19", "sec": "第五讲", "type": "多选题", "q": "关于中国式现代化是物质文明和精神文明相协调的现代化，下列认识正确的是（ ）。", "options": [{"k": "A", "v": "物质文明和精神文明相协调是中国共产党一以贯之的追求"}, {"k": "B", "v": "西方现代化道路重物质而轻精神的趋向引发一系列现代性问题"}, {"k": "C", "v": "中国式现代化以马克思主义为指导，必然以人的自由全面发展为目标"}, {"k": "D", "v": "物质文明建设与精神文明建设是相互孤立的，可以分别推进"}], "a": "ABC", "at": "A. 物质文明和精神文明相协调是中国共产党一以贯之的追求；B. 西方现代化道路重物质而轻精神的趋向引发一系列现代性问题；C. 中国式现代化以马克思主义为指导，必然以人的自由全面发展为目标", "note": "两个文明相互促进、共同发展，\"相互孤立、分别推进\"的说法错误，D 不选。"}, {"id": "20", "sec": "第五讲", "type": "多选题", "q": "关于文化事业与文化产业的关系，下列认识正确的是（ ）。", "options": [{"k": "A", "v": "文化事业以公共财政为支撑，核心特征是公益性、基本性、均等性、便利性"}, {"k": "B", "v": "文化产业以市场为导向，目标是满足人民群众多样化、多层次、多方面的精神文化需求"}, {"k": "C", "v": "文化事业与文化产业截然分开，不需要协调发展"}, {"k": "D", "v": "推动文化事业与文化产业协调发展，才能满足人民日益增长的精神文化需求"}], "a": "ABD", "at": "A. 文化事业以公共财政为支撑，核心特征是公益性、基本性、均等性、便利性；B. 文化产业以市场为导向，目标是满足人民群众多样化、多层次、多方面的精神文化需求；D. 推动文化事业与文化产业协调发展，才能满足人民日益增长的精神文化需求", "note": "文化事业与文化产业相辅相成，必须协调发展，C 项\"截然分开、不需协调\"错误。"}, {"id": "21", "sec": "第五讲", "type": "多选题", "q": "舞剧《只此青绿》成功实现了对中华优秀传统文化的创造性转化和创新性发展，其具体做法包括（ ）。", "options": [{"k": "A", "v": "以《千里江山图》为灵感进行编创"}, {"k": "B", "v": "止步于剧场演出，不拓展其他产品形态"}, {"k": "C", "v": "走向世界，成为知名的文化品牌"}, {"k": "D", "v": "系统性地开发电影、音乐、文创等产品，形成产业生态"}], "a": "ACD", "at": "A. 以《千里江山图》为灵感进行编创；C. 走向世界，成为知名的文化品牌；D. 系统性地开发电影、音乐、文创等产品，形成产业生态", "note": "《只此青绿》以《千里江山图》为灵感，走向世界并系统开发多元产品形态；B 项\"止步于剧场\"与事实相反。"}, {"id": "22", "sec": "第五讲", "type": "多选题", "q": "创作无愧于时代的\"精品力作\"，其\"精\"体现在（ ）。", "options": [{"k": "A", "v": "思想精深"}, {"k": "B", "v": "艺术精湛"}, {"k": "C", "v": "制作精良"}, {"k": "D", "v": "利润最大化至上"}], "a": "ABC", "at": "A. 思想精深；B. 艺术精湛；C. 制作精良", "note": "\"精\"体现在思想精深、艺术精湛、制作精良相统一；D 项与文艺创作的价值导向相悖。"}, {"id": "23", "sec": "第五讲", "type": "多选题", "q": "关于\"一个国家实行什么样的主义，关键要看这个主义能否解决这个国家面临的历史性课题\"的认识，下列说法错误的是（ ）。", "options": [{"k": "A", "v": "一个国家实行什么样的主义，关键看它在其他国家是否同样适用"}, {"k": "B", "v": "资本主义现代化道路可以解决中国面临的历史性课题"}, {"k": "C", "v": "历史性课题只包含经济发展问题，与文化发展无关"}, {"k": "D", "v": "中国式现代化是以马克思主义为指导思想的现代化"}], "a": "ABC", "at": "A. 一个国家实行什么样的主义，关键看它在其他国家是否同样适用；B. 资本主义现代化道路可以解决中国面临的历史性课题；C. 历史性课题只包含经济发展问题，与文化发展无关", "note": "关键在于能否解决本国面临的课题，而非看他国是否适用，A 错；资本主义道路没能解决中国的历史性课题，B 错；历史性课题涵盖经济、文化等各领域，C 错；D 表述正确，不选。"}, {"id": "24", "sec": "第五讲", "type": "多选题", "q": "\"文明优越论\"的思潮会带来哪些消极影响？（ ）", "options": [{"k": "A", "v": "部分国家和民族丧失文化主体性"}, {"k": "B", "v": "世界文明多样性遭到破坏"}, {"k": "C", "v": "孤立主义、文化保护主义思潮抬头"}, {"k": "D", "v": "推动各国开展平等的文化交流"}], "a": "ABC", "at": "A. 部分国家和民族丧失文化主体性；B. 世界文明多样性遭到破坏；C. 孤立主义、文化保护主义思潮抬头", "note": "文明优越论破坏文明多样性、导致文化主体性丧失与保护主义抬头，与平等交流相悖，D 不选。"}, {"id": "25", "sec": "第五讲", "type": "多选题", "q": "以下哪些是中国在新能源领域取得的成就？（ ）", "options": [{"k": "A", "v": "为实现\"双碳\"目标，建成全球规模最大的碳市场"}, {"k": "B", "v": "水电、风电、太阳能发电、生物质发电装机容量位居全球首位"}, {"k": "C", "v": "新能源汽车产销量连续十年位居世界第一"}, {"k": "D", "v": "完全垄断全球可再生能源市场"}], "a": "ABC", "at": "A. 为实现\"双碳\"目标，建成全球规模最大的碳市场；B. 水电、风电、太阳能发电、生物质发电装机容量位居全球首位；C. 新能源汽车产销量连续十年位居世界第一", "note": "中国建成全球最大碳市场、可再生能源装机全球第一、新能源汽车产销量连续十年世界第一；\"完全垄断\"说法错误，D 不选。"}, {"id": "26", "sec": "第五讲", "type": "多选题", "q": "文中提到的\"一带一路\"基础设施项目包含哪些？（ ）", "options": [{"k": "A", "v": "中老铁路"}, {"k": "B", "v": "比雷埃夫斯港"}, {"k": "C", "v": "乌兹别克斯坦跨境高铁"}, {"k": "D", "v": "跨洲海底隧道"}], "a": "AB", "at": "A. 中老铁路；B. 比雷埃夫斯港", "note": "文中提到的\"一带一路\"项目有中老铁路、希腊比雷埃夫斯港以及希瓦古城修复等；C、D 未在文中提及。"}, {"id": "27", "sec": "第五讲", "type": "多选题", "q": "中国采取了哪些举措来便利外国人士入境，促进国际间人文交流与文化往来？（ ）", "options": [{"k": "A", "v": "扩大单方面免签入境国家范围"}, {"k": "B", "v": "为入境游客优化支付、语言、出行等配套服务"}, {"k": "C", "v": "禁止所有境外博主来华"}, {"k": "D", "v": "坚持文化\"走出去\"与\"请进来\"并举，全方位扩大国际人文交流"}], "a": "ABD", "at": "A. 扩大单方面免签入境国家范围；B. 为入境游客优化支付、语言、出行等配套服务；D. 坚持文化\"走出去\"与\"请进来\"并举，全方位扩大国际人文交流", "note": "中国持续扩大免签范围、优化入境服务、坚持\"走出去\"与\"请进来\"并举；C 项与事实完全相反。"}, {"id": "28", "sec": "第五讲", "type": "多选题", "q": "作为联合国安理会常任理事国，中国做出了哪些贡献？（ ）", "options": [{"k": "A", "v": "是联合国第二大会费国、第二大维和摊款国"}, {"k": "B", "v": "在安理会常任理事国中，派出维和人员数量最多"}, {"k": "C", "v": "放弃所有海外维和任务"}, {"k": "D", "v": "多次斡旋调解各类国际地区冲突"}], "a": "ABD", "at": "A. 是联合国第二大会费国、第二大维和摊款国；B. 在安理会常任理事国中，派出维和人员数量最多；D. 多次斡旋调解各类国际地区冲突", "note": "中国是联合国第二大会费国和维和摊款国，是安理会常任理事国中派出维和人员最多的国家，并多次斡旋国际冲突；C 与事实相反。"}, {"id": "29", "sec": "第五讲", "type": "多选题", "q": "针对国际热点冲突，中国开展的斡旋工作有哪些？（ ）", "options": [{"k": "A", "v": "派遣特使为俄乌冲突开展穿梭斡旋"}, {"k": "B", "v": "在巴以冲突升级后，促成巴勒斯坦各派在北京举行和解对话"}, {"k": "C", "v": "对中东地区战事直接进行军事干预"}, {"k": "D", "v": "对各类地区武装冲突置之不理"}], "a": "AB", "at": "A. 派遣特使为俄乌冲突开展穿梭斡旋；B. 在巴以冲突升级后，促成巴勒斯坦各派在北京举行和解对话", "note": "中国派遣特使就俄乌冲突穿梭斡旋，促成巴勒斯坦各派签署《北京宣言》；中国坚持和平斡旋，不搞军事干预，C、D 错误。"}, {"id": "30", "sec": "第五讲", "type": "多选题", "q": "中乌合作修缮希瓦古城项目，为当地民众带来了哪些益处？（ ）", "options": [{"k": "A", "v": "聘用当地工匠与工人，创造就业岗位"}, {"k": "B", "v": "为当地文物保护从业者提供专业技能培训"}, {"k": "C", "v": "带动当地经济发展、改善民生"}, {"k": "D", "v": "彻底改变当地传统生活方式"}], "a": "ABC", "at": "A. 聘用当地工匠与工人，创造就业岗位；B. 为当地文物保护从业者提供专业技能培训；C. 带动当地经济发展、改善民生", "note": "项目聘用当地工匠、开展技能培训、带动文旅与经济发展；\"彻底改变当地传统生活方式\"不符合最小干预原则，D 错误。"}, {"id": "31", "sec": "第五讲", "type": "多选题", "q": "爆款短视频《解锁青春大运》具备哪些特点？（ ）", "options": [{"k": "A", "v": "融合成都传统文化与现代体育"}, {"k": "B", "v": "结合川味说唱与元宇宙数字场景"}, {"k": "C", "v": "纯粹展示古典艺术，不含任何现代元素"}, {"k": "D", "v": "采用跨时空创意拍摄手法"}], "a": "ABD", "at": "A. 融合成都传统文化与现代体育；B. 结合川味说唱与元宇宙数字场景；D. 采用跨时空创意拍摄手法", "note": "该视频融合传统文化与现代体育、结合川味说唱与数字场景、采用跨时空创意手法；C 项\"不含任何现代元素\"错误。"}, {"id": "32", "sec": "第五讲", "type": "多选题", "q": "全人类共同价值包含哪些内容？（ ）", "options": [{"k": "A", "v": "和平、发展"}, {"k": "B", "v": "公平、正义"}, {"k": "C", "v": "民主、自由"}, {"k": "D", "v": "霸权主义、排他思想"}], "a": "ABC", "at": "A. 和平、发展；B. 公平、正义；C. 民主、自由", "note": "全人类共同价值为和平、发展、公平、正义、民主、自由；D 项不属于其中。"}, {"id": "33", "sec": "第五讲", "type": "判断题", "q": "中国式现代化是物质文明和精神文明相协调的现代化。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "这是中国式现代化五个中国特色之一。"}, {"id": "34", "sec": "第五讲", "type": "判断题", "q": "贵州榕江\"村超\"既提升了群众的物质生活水平，又丰富了精神世界，是物质文明和精神文明协调发展的生动写照。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"村超\"带动消费与旅游、丰富群众精神文化生活，正是两个文明协调发展的生动写照。"}, {"id": "35", "sec": "第五讲", "type": "判断题", "q": "文化事业的核心特征是市场性、营利性。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "文化事业的核心特征是公益性、基本性、均等性、便利性；市场性、营利性是文化产业的属性。"}, {"id": "36", "sec": "第五讲", "type": "判断题", "q": "中国共产党从改革开放以后，才开始注重物质文明和精神文明协调发展。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "物质文明和精神文明相协调发展是中国共产党一以贯之的追求，并非改革开放之后才开始。"}, {"id": "37", "sec": "第五讲", "type": "判断题", "q": "探索文化和科技融合的有效机制，目的是让科技完全取代人类进行文化创作。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "目的是催生文化新业态、形成新的增长点，科技是赋能工具，不能完全取代人类的创造性劳动。"}, {"id": "38", "sec": "第五讲", "type": "判断题", "q": "中华文明自古就以开放包容闻名于世，在同其他文明的交流互鉴中不断焕发新的生命力。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中华文明具有突出的包容性，历来在开放交流、兼收并蓄中生生不息。"}, {"id": "39", "sec": "第五讲", "type": "判断题", "q": "中国已将和平发展写入宪法和执政党党章。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"坚持和平发展道路\"已先后写入《中华人民共和国宪法》和中国共产党党章。"}, {"id": "40", "sec": "第五讲", "type": "判断题", "q": "在希瓦古城修缮项目中，中方施工团队采用全面现代化整体重建的方式改造古建筑。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中方坚持\"最小干预、预防性保护\"的理念，修旧如旧，而非全面现代化重建。"}, {"id": "41", "sec": "第五讲", "type": "判断题", "q": "构建人类命运共同体，能够团结不同文明、不同发展水平的国家共同应对全球挑战。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "人类命运共同体理念超越文明隔阂与发展差异，倡导各国团结合作、共应挑战。"}, {"id": "1", "sec": "第六讲", "type": "单选题", "q": "本讲一开始引用了哪部科幻电影的台词来对当今世界的生态危机发出警诫？（ ）", "options": [{"k": "A", "v": "《后天》"}, {"k": "B", "v": "《流浪地球2》"}, {"k": "C", "v": "《星际穿越》"}, {"k": "D", "v": "《2012》"}], "a": "B", "at": "B. 《流浪地球2》", "note": "本讲开头引用了《流浪地球2》的台词，警示生态危机与每个人息息相关。"}, {"id": "2", "sec": "第六讲", "type": "单选题", "q": "生态环境问题归根到底是（ ）问题。", "options": [{"k": "A", "v": "资金投入与市场定价问题"}, {"k": "B", "v": "国际条约与地缘政治问题"}, {"k": "C", "v": "发展方式和生活方式问题"}, {"k": "D", "v": "资源短缺与人口爆炸问题"}], "a": "C", "at": "C. 发展方式和生活方式问题", "note": "生态环境问题归根到底是发展方式和生活方式问题，必须推动形成绿色低碳的发展方式和生活方式。"}, {"id": "3", "sec": "第六讲", "type": "单选题", "q": "根据世界气象组织（WMO）2025 年通报，过去的 11 年（2015—2025 年）中，每一年都在（ ）的观测记录中跻身最暖的 11 年之列。", "options": [{"k": "A", "v": "50 年"}, {"k": "B", "v": "100 年"}, {"k": "C", "v": "176 年"}, {"k": "D", "v": "250 年"}], "a": "C", "at": "C. 176 年", "note": "WMO 全球观测记录约始于 1850 年，至今约 176 年，2015—2025 年是这一记录中最暖的 11 年。"}, {"id": "4", "sec": "第六讲", "type": "单选题", "q": "国际社会在（ ）年达成了《联合国气候变化框架公约》（UNFCCC）。", "options": [{"k": "A", "v": "1990"}, {"k": "B", "v": "1992"}, {"k": "C", "v": "1997"}, {"k": "D", "v": "2015"}], "a": "B", "at": "B. 1992", "note": "1992 年在里约联合国环境与发展大会上达成《联合国气候变化框架公约》，是全球气候治理的基石。"}, {"id": "5", "sec": "第六讲", "type": "单选题", "q": "中国国家主席习近平在（ ）第 75 届联合国大会一般性辩论时宣布了中国的\"双碳\"目标。", "options": [{"k": "A", "v": "2012 年 9 月 22 日"}, {"k": "B", "v": "2015 年 10 月 24 日"}, {"k": "C", "v": "2020 年 9 月 22 日"}, {"k": "D", "v": "2022 年 3 月 15 日"}], "a": "C", "at": "C. 2020 年 9 月 22 日", "note": "2020 年 9 月 22 日，习近平在第七十五届联合国大会一般性辩论上宣布中国\"二氧化碳排放力争于 2030 年前达到峰值，努力争取 2060 年前实现碳中和\"。"}, {"id": "6", "sec": "第六讲", "type": "单选题", "q": "中国承诺二氧化碳排放力争于（ ）之前达到峰值。", "options": [{"k": "A", "v": "2025 年"}, {"k": "B", "v": "2030 年"}, {"k": "C", "v": "2035 年"}, {"k": "D", "v": "2060 年"}], "a": "B", "at": "B. 2030 年", "note": "\"双碳\"目标中的碳达峰目标是力争 2030 年前实现。"}, {"id": "7", "sec": "第六讲", "type": "单选题", "q": "中国的目标是努力争取在（ ）之前实现碳中和。", "options": [{"k": "A", "v": "2030 年"}, {"k": "B", "v": "2045 年"}, {"k": "C", "v": "2050 年"}, {"k": "D", "v": "2060 年"}], "a": "D", "at": "D. 2060 年", "note": "\"双碳\"目标中的碳中和目标是努力争取 2060 年前实现。"}, {"id": "8", "sec": "第六讲", "type": "单选题", "q": "（ ）是指某个国家或地区的二氧化碳排放量达到历史最高值，经历平台期后持续下降的过程，是二氧化碳排放量由增转降的历史拐点。", "options": [{"k": "A", "v": "碳中和"}, {"k": "B", "v": "碳达峰"}, {"k": "C", "v": "碳汇"}, {"k": "D", "v": "碳足迹"}], "a": "B", "at": "B. 碳达峰", "note": "碳达峰是碳排放量由增转降的历史拐点；碳中和则是排放与吸收相互抵消、实现\"净零排放\"。"}, {"id": "9", "sec": "第六讲", "type": "单选题", "q": "实现碳达峰意味着一个国家或地区的经济社会发展与二氧化碳排放实现\"脱钩\"，即经济增长不再以（ ）为代价。", "options": [{"k": "A", "v": "人类劳动"}, {"k": "B", "v": "市场机制"}, {"k": "C", "v": "科技创新"}, {"k": "D", "v": "碳排放增加"}], "a": "D", "at": "D. 碳排放增加", "note": "碳达峰后经济增长与碳排放脱钩，即经济增长不再依赖碳排放的增加。"}, {"id": "10", "sec": "第六讲", "type": "单选题", "q": "中国计划用（ ）左右的时间实现从碳达峰到碳中和的过渡。", "options": [{"k": "A", "v": "15 年"}, {"k": "B", "v": "30 年"}, {"k": "C", "v": "50 年"}, {"k": "D", "v": "70 年"}], "a": "B", "at": "B. 30 年", "note": "从 2030 年前碳达峰到 2060 年前碳中和，中国计划用约 30 年完成这一过渡，远快于发达国家的过渡期。"}, {"id": "11", "sec": "第六讲", "type": "单选题", "q": "在中国碳减排的\"1+N\"政策体系中，\"1\"代表（ ）。", "options": [{"k": "A", "v": "国际气候援助计划"}, {"k": "B", "v": "31 个省（区、市）的本地方案"}, {"k": "C", "v": "指导思想和顶层设计"}, {"k": "D", "v": "分领域分行业碳达峰实施方案"}], "a": "C", "at": "C. 指导思想和顶层设计", "note": "\"1\"是碳达峰碳中和工作的意见等指导思想和顶层设计，\"N\"是分领域分行业实施方案及保障方案。"}, {"id": "12", "sec": "第六讲", "type": "单选题", "q": "在处理发展和减排的关系时，减排并不意味着（ ）。", "options": [{"k": "A", "v": "降低碳排放强度"}, {"k": "B", "v": "减生产力或完全不排放"}, {"k": "C", "v": "向绿色增长转型"}, {"k": "D", "v": "优先保护自然"}], "a": "B", "at": "B. 减生产力或完全不排放", "note": "减排不是不发展、不是\"减生产力\"，也不是完全不排放，而是在发展中降碳、实现绿色转型。"}, {"id": "13", "sec": "第六讲", "type": "单选题", "q": "中国致力于协同推进降碳、减污、扩绿、增长，其中（ ）是\"做减法\"。", "options": [{"k": "A", "v": "扩绿、增长"}, {"k": "B", "v": "降碳、减污"}, {"k": "C", "v": "扩绿、减污"}, {"k": "D", "v": "降碳、增长"}], "a": "B", "at": "B. 降碳、减污", "note": "降碳、减污是\"做减法\"，扩绿、增长是\"做加法\"。"}, {"id": "14", "sec": "第六讲", "type": "单选题", "q": "（ ）是碳排放的最主要来源。", "options": [{"k": "A", "v": "农业种植"}, {"k": "B", "v": "能源活动"}, {"k": "C", "v": "医疗保健"}, {"k": "D", "v": "废物管理"}], "a": "B", "at": "B. 能源活动", "note": "能源活动是碳排放的最主要来源，能源绿色低碳转型是\"双碳\"工作的关键。"}, {"id": "15", "sec": "第六讲", "type": "单选题", "q": "在本讲引用的案例中，（ ）被表述为绿色电能稳定供应和新能源增长的成功典范。", "options": [{"k": "A", "v": "九江市棉船岛"}, {"k": "B", "v": "唐山市南湖公园"}, {"k": "C", "v": "浙江省\"蓝色循环\"模式"}, {"k": "D", "v": "河南省郑州市"}], "a": "A", "at": "A. 九江市棉船岛", "note": "江西九江棉船岛依托风光储一体化实现全绿电稳定供应，是绿色电能稳定供应和新能源增长的成功典范。"}, {"id": "16", "sec": "第六讲", "type": "单选题", "q": "从 2020 年到 2024 年，非化石能源在中国能源消费总量中的比重增长到了（ ）。", "options": [{"k": "A", "v": "11.6%"}, {"k": "B", "v": "16.0%"}, {"k": "C", "v": "19.8%"}, {"k": "D", "v": "25.09%"}], "a": "C", "at": "C. 19.8%", "note": "非化石能源消费比重由 2020 年的 16.0% 增长到 2024 年的 19.8%。"}, {"id": "17", "sec": "第六讲", "type": "单选题", "q": "2023 年浙江省凭借\"蓝色循环\"（Blue Circle）模式荣获联合国环境规划署（UNEP）颁发的（ ）。", "options": [{"k": "A", "v": "全球绿色催化剂奖"}, {"k": "B", "v": "地球卫士奖"}, {"k": "C", "v": "赤道奖"}, {"k": "D", "v": "可持续发展先锋"}], "a": "B", "at": "B. 地球卫士奖", "note": "2023 年浙江\"蓝色循环\"海洋塑料废弃物治理模式获联合国环境规划署\"地球卫士奖\"。"}, {"id": "18", "sec": "第六讲", "type": "单选题", "q": "河北省唐山市南湖公园在经过长达 16 年的生态治理修复之前，原本是什么区域？（ ）", "options": [{"k": "A", "v": "海上风电码头"}, {"k": "B", "v": "海洋塑料回收点"}, {"k": "C", "v": "共享单车制造厂"}, {"k": "D", "v": "采煤沉降区"}], "a": "D", "at": "D. 采煤沉降区", "note": "唐山南湖原为采煤沉降区（采煤塌陷地），经过 16 年治理修复成为城市生态公园。"}, {"id": "19", "sec": "第六讲", "type": "单选题", "q": "《中华人民共和国国民经济和社会发展第十五个五年规划纲要》在（ ）中华人民共和国十四届全国人大四次会议表决通过。", "options": [{"k": "A", "v": "2023 年 3 月 12 日"}, {"k": "B", "v": "2024 年 3 月 12 日"}, {"k": "C", "v": "2025 年 3 月 12 日"}, {"k": "D", "v": "2026 年 3 月 12 日"}], "a": "D", "at": "D. 2026 年 3 月 12 日", "note": "\"十五五\"规划纲要于 2026 年 3 月经十四届全国人大四次会议表决通过。"}, {"id": "20", "sec": "第六讲", "type": "单选题", "q": "生产方式和生活方式的全面绿色低碳转型，本质上是走向（ ）的现代化。", "options": [{"k": "A", "v": "生态文明"}, {"k": "B", "v": "后工业技术社会"}, {"k": "C", "v": "商业化海洋网络"}, {"k": "D", "v": "数字化城市经济"}], "a": "A", "at": "A. 生态文明", "note": "全面绿色低碳转型的本质是走向生态文明的现代化。"}, {"id": "21", "sec": "第六讲", "type": "多选题", "q": "当下人类社会面临的全球性挑战包括（ ）。", "options": [{"k": "A", "v": "恐怖主义"}, {"k": "B", "v": "网络安全"}, {"k": "C", "v": "生物安全"}, {"k": "D", "v": "气候变化"}], "a": "ABCD", "at": "A. 恐怖主义；B. 网络安全；C. 生物安全；D. 气候变化", "note": "恐怖主义、网络安全、生物安全、气候变化等都是人类社会面临的全球性挑战，全选。"}, {"id": "22", "sec": "第六讲", "type": "多选题", "q": "面对气候变化带来的挑战，人类社会取得的全球气候治理成果包括（ ）。", "options": [{"k": "A", "v": "《联合国气候变化框架公约》"}, {"k": "B", "v": "《京都议定书》"}, {"k": "C", "v": "《坎昆协议》"}, {"k": "D", "v": "《巴黎协定》"}], "a": "ABCD", "at": "A. 《联合国气候变化框架公约》；B. 《京都议定书》；C. 《坎昆协议》；D. 《巴黎协定》", "note": "四项均为全球气候治理进程中的标志性成果，全选。"}, {"id": "23", "sec": "第六讲", "type": "多选题", "q": "中国在努力实现\"双碳\"目标的过程中，强调要注重处理好的四对关键关系包括哪些？（ ）", "options": [{"k": "A", "v": "发展和减排的关系"}, {"k": "B", "v": "整体和局部的关系"}, {"k": "C", "v": "长远目标和短期目标的关系"}, {"k": "D", "v": "政府和市场的关系"}], "a": "ABCD", "at": "A. 发展和减排的关系；B. 整体和局部的关系；C. 长远目标和短期目标的关系；D. 政府和市场的关系", "note": "习近平总书记强调处理好四对关系：发展和减排、整体和局部、长远目标和短期目标、政府和市场，全选。"}, {"id": "24", "sec": "第六讲", "type": "多选题", "q": "中国致力于协同推进降碳、减污、扩绿、增长，其中的哪两个方面是\"做加法\"？（ ）", "options": [{"k": "A", "v": "降碳"}, {"k": "B", "v": "扩绿"}, {"k": "C", "v": "减污"}, {"k": "D", "v": "增长"}], "a": "BD", "at": "B. 扩绿；D. 增长", "note": "扩绿、增长是\"做加法\"；降碳、减污是\"做减法\"。"}, {"id": "25", "sec": "第六讲", "type": "多选题", "q": "\"扩绿\"能够（ ）。", "options": [{"k": "A", "v": "增强碳汇能力"}, {"k": "B", "v": "提升生态系统多样性、稳定性和持续性"}, {"k": "C", "v": "完全消除对化石能源的需求"}, {"k": "D", "v": "进一步扩大环境容量"}], "a": "ABD", "at": "A. 增强碳汇能力；B. 提升生态系统多样性、稳定性和持续性；D. 进一步扩大环境容量", "note": "扩绿能增强碳汇、提升生态系统质量、扩大环境容量；\"完全消除化石能源需求\"说法绝对，C 错误。"}, {"id": "26", "sec": "第六讲", "type": "多选题", "q": "中国的非化石能源体系包含以下哪些选项？（ ）", "options": [{"k": "A", "v": "风能"}, {"k": "B", "v": "水能"}, {"k": "C", "v": "地热能"}, {"k": "D", "v": "海洋能"}], "a": "ABCD", "at": "A. 风能；B. 水能；C. 地热能；D. 海洋能", "note": "风能、水能、地热能、海洋能均属非化石能源，全选。"}, {"id": "27", "sec": "第六讲", "type": "多选题", "q": "从 2020 年到 2024 年，中国能源消费配置发生了哪些具体变化？（ ）", "options": [{"k": "A", "v": "非化石能源比重从 16.0% 增长到 19.8%"}, {"k": "B", "v": "化石能源比重从 84.0% 下降到 80.2%"}, {"k": "C", "v": "非化石能源比重恰好达到 50%"}, {"k": "D", "v": "化石能源比重降至 0%"}], "a": "AB", "at": "A. 非化石能源比重从 16.0% 增长到 19.8%；B. 化石能源比重从 84.0% 下降到 80.2%", "note": "非化石能源比重由 16.0% 升至 19.8%，化石能源相应由 84.0% 降至 80.2%；C、D 与事实不符。"}, {"id": "28", "sec": "第六讲", "type": "多选题", "q": "浙江省的\"蓝色循环\"模式使用了哪些技术来追踪海洋塑料废弃物？（ ）", "options": [{"k": "A", "v": "区块链"}, {"k": "B", "v": "物联网"}, {"k": "C", "v": "量子计算"}, {"k": "D", "v": "卫星激光武器"}], "a": "AB", "at": "A. 区块链；B. 物联网", "note": "\"蓝色循环\"利用区块链和物联网技术对海洋塑料废弃物进行全流程追溯。"}, {"id": "29", "sec": "第六讲", "type": "多选题", "q": "为了共建地球生命共同体，有必要采取以下哪些行动？（ ）", "options": [{"k": "A", "v": "破除单边主义的壁垒和藩篱"}, {"k": "B", "v": "在携手合作中建设清洁美丽世界"}, {"k": "C", "v": "树立保护性的区域贸易壁垒"}, {"k": "D", "v": "始终秉持人类命运共同体理念"}], "a": "ABD", "at": "A. 破除单边主义的壁垒和藩篱；B. 在携手合作中建设清洁美丽世界；D. 始终秉持人类命运共同体理念", "note": "共建地球生命共同体需要破除单边主义、深化合作、秉持命运共同体理念；树立贸易壁垒与开放合作背道而驰，C 错误。"}, {"id": "30", "sec": "第六讲", "type": "多选题", "q": "本讲在阐述气候变化带来的危机时提及了哪些电影？（ ）", "options": [{"k": "A", "v": "《流浪地球2》"}, {"k": "B", "v": "《后天》"}, {"k": "C", "v": "《阿凡达》"}, {"k": "D", "v": "《星际穿越》"}], "a": "AB", "at": "A. 《流浪地球2》；B. 《后天》", "note": "本讲提及《流浪地球2》与《后天》两部影片来警示气候危机；C、D 未提及。"}, {"id": "31", "sec": "第六讲", "type": "判断题", "q": "中国式现代化完全排斥各国现代化的共同特征。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色，并非排斥共同特征。"}, {"id": "32", "sec": "第六讲", "type": "判断题", "q": "\"碳达峰\"是指经济增长完全停止以使排放量下降的节点。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "碳达峰是碳排放量达到峰值后由增转降的拐点，实现碳达峰不要求经济增长停止，而是实现经济增长与碳排放\"脱钩\"。"}, {"id": "33", "sec": "第六讲", "type": "判断题", "q": "中国强调\"全国一盘棋\"，这意味着强制所有地区采取\"一刀切\"的模式，而不考虑地方资源差异和产业分工。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "\"全国一盘棋\"强调统筹协调、整体和局部相结合，各地要立足资源禀赋和产业分工因地制宜，绝非\"一刀切\"。"}, {"id": "34", "sec": "第六讲", "type": "判断题", "q": "为了实现\"双碳\"目标，必须搞\"碳冲锋\"\"运动式减碳\"。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中央明确要求纠正\"碳冲锋\"和\"运动式减碳\"，坚持先立后破、稳中求进。"}, {"id": "35", "sec": "第六讲", "type": "判断题", "q": "在中国\"1+N\"的碳减排政策体系中，\"N\"是指一系列能源、工业、交通运输、城乡建设等分领域分行业的碳达峰实施方案以及相关保障方案。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"N\"即分领域分行业碳达峰实施方案及相关支撑保障方案，与\"1\"共同构成\"1+N\"政策体系。"}, {"id": "36", "sec": "第六讲", "type": "判断题", "q": "实现\"双碳\"目标不仅要推动能源转型，还要推进工业、交通、居民生活等重点领域的低碳发展。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"双碳\"是系统性变革，能源是关键，工业、交通、城乡建设、居民生活等重点领域都要协同推进低碳转型。"}, {"id": "37", "sec": "第六讲", "type": "判断题", "q": "新能源汽车、锂电池和光伏产品被认为是\"中国制造\"的\"新名片\"。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"新三样\"（新能源汽车、锂电池、光伏产品）出口强劲，被誉为\"中国制造\"的\"新名片\"。"}, {"id": "38", "sec": "第六讲", "type": "判断题", "q": "浙江的\"蓝色循环\"模式是利用区块链和物联网技术来监测太空垃圾。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "\"蓝色循环\"利用区块链和物联网技术追踪治理的是**海洋塑料废弃物**，而非太空垃圾。"}, {"id": "39", "sec": "第六讲", "type": "判断题", "q": "2024 年中国森林覆盖率达 25.09%，草原综合植被盖度达 50.52%。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "2024 年我国森林覆盖率超过 25%、草原综合植被盖度达 50% 以上，生态本底持续改善。"}, {"id": "40", "sec": "第六讲", "type": "判断题", "q": "国际社会的通力合作是共同应对\"气候变化\"这一全球性问题的必然要求。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "气候变化是全人类共同挑战，任何国家都无法独善其身，国际通力合作是必然要求。"}, {"id": "1", "sec": "第七讲", "type": "单选题", "q": "党的十八大以来，对外工作领域一系列重大理论与实践创新最终凝练为（ ）。", "options": [{"k": "A", "v": "习近平外交思想"}, {"k": "B", "v": "全球文明倡议"}, {"k": "C", "v": "全球治理倡议"}, {"k": "D", "v": "\"一带一路\"倡议"}], "a": "A", "at": "A. 习近平外交思想", "note": "党的十八大以来对外工作的重大理论和实践创新最终凝练为习近平外交思想，是新时代中国外交的根本遵循。"}, {"id": "2", "sec": "第七讲", "type": "单选题", "q": "2018 年 6 月召开的中央外事工作会议，首次系统阐述了习近平外交思想的内涵，并将其核心要义概括为（ ）。", "options": [{"k": "A", "v": "四大全球倡议"}, {"k": "B", "v": "\"十个坚持\""}, {"k": "C", "v": "\"五通\"建设"}, {"k": "D", "v": "\"四个共同倡导\""}], "a": "B", "at": "B. \"十个坚持\"", "note": "2018 年中央外事工作会议首次系统阐述习近平外交思想，将其核心要义概括为\"十个坚持\"。"}, {"id": "3", "sec": "第七讲", "type": "单选题", "q": "党的二十大进一步丰富和发展了习近平外交思想，并为新时代全面推进什么描绘了宏伟蓝图？（ ）", "options": [{"k": "A", "v": "全球发展倡议"}, {"k": "B", "v": "周边命运共同体"}, {"k": "C", "v": "中国特色大国外交"}, {"k": "D", "v": "国际调解院建设"}], "a": "C", "at": "C. 中国特色大国外交", "note": "党的二十大对新时代全面推进中国特色大国外交作出战略部署，描绘了宏伟蓝图。"}, {"id": "4", "sec": "第七讲", "type": "单选题", "q": "坚持什么是外交最鲜明的特征和最大政治优势？（ ）", "options": [{"k": "A", "v": "党的领导"}, {"k": "B", "v": "开放发展"}, {"k": "C", "v": "文明互鉴"}, {"k": "D", "v": "绿色低碳"}], "a": "A", "at": "A. 党的领导", "note": "党的领导是中国外交最鲜明的特征和最大的政治优势。"}, {"id": "5", "sec": "第七讲", "type": "单选题", "q": "实现党对外事工作集中统一领导的核心原则是（ ）。", "options": [{"k": "A", "v": "以多边主义为全球治理路径"}, {"k": "B", "v": "外交大权在党中央"}, {"k": "C", "v": "坚持人与自然和谐共生"}, {"k": "D", "v": "推动地方间友好交往"}], "a": "B", "at": "B. 外交大权在党中央", "note": "\"外交大权在党中央\"是实现党对外事工作集中统一领导的核心原则。"}, {"id": "6", "sec": "第七讲", "type": "单选题", "q": "2016 年 G20 杭州峰会上，习近平主席主持会议凝聚了什么全球共识？（ ）", "options": [{"k": "A", "v": "和平、发展、公平、正义"}, {"k": "B", "v": "共商、共建、共享"}, {"k": "C", "v": "创新、活力、联动、包容"}, {"k": "D", "v": "开放、绿色、廉洁"}], "a": "C", "at": "C. 创新、活力、联动、包容", "note": "G20 杭州峰会确立\"创新、活力、联动、包容\"的主题，凝聚了世界经济领域相关共识。"}, {"id": "7", "sec": "第七讲", "type": "单选题", "q": "2016 年 G20 杭州峰会首次将什么置于全球宏观政策框架核心位置？（ ）", "options": [{"k": "A", "v": "文明议题"}, {"k": "B", "v": "安全议题"}, {"k": "C", "v": "治理议题"}, {"k": "D", "v": "发展议题"}], "a": "D", "at": "D. 发展议题", "note": "杭州峰会首次把发展问题置于全球宏观政策框架的突出（核心）位置。"}, {"id": "8", "sec": "第七讲", "type": "单选题", "q": "G20 杭州峰会后，中国在国际经济治理中的角色发生转变，从\"规则接受者\"变为（ ）。", "options": [{"k": "A", "v": "\"规则制定者\""}, {"k": "B", "v": "\"文明互鉴的促进力量\""}, {"k": "C", "v": "\"开放发展的中坚力量\""}, {"k": "D", "v": "\"国际和地区安全的维护者\""}], "a": "A", "at": "A. \"规则制定者\"", "note": "杭州峰会标志着中国从国际经贸规则的\"规则接受者\"向\"规则制定者\"转变，国际影响力显著提升。"}, {"id": "9", "sec": "第七讲", "type": "单选题", "q": "中国特色大国外交始终以什么为使命？（ ）", "options": [{"k": "A", "v": "构建全球治理体系"}, {"k": "B", "v": "实现中华民族伟大复兴"}, {"k": "C", "v": "推动文明对话国际日"}, {"k": "D", "v": "开展\"小而美\"民生项目"}], "a": "B", "at": "B. 实现中华民族伟大复兴", "note": "中国特色大国外交始终以实现中华民族伟大复兴为使命，服务民族复兴、促进人类进步。"}, {"id": "10", "sec": "第七讲", "type": "单选题", "q": "中国的发展不是\"零和游戏\"，而是（ ）。", "options": [{"k": "A", "v": "\"主动引领\""}, {"k": "B", "v": "\"推倒重来\""}, {"k": "C", "v": "\"共赢合作\""}, {"k": "D", "v": "\"另起炉灶\""}], "a": "C", "at": "C. \"共赢合作\"", "note": "中国的发展不是\"零和游戏\"，而是\"共赢合作\"；中国不搞你输我赢的博弈，追求互利共赢。"}, {"id": "11", "sec": "第七讲", "type": "单选题", "q": "中国式现代化是走什么道路的现代化？（ ）", "options": [{"k": "A", "v": "全球治理道路"}, {"k": "B", "v": "文明互鉴道路"}, {"k": "C", "v": "数字南方道路"}, {"k": "D", "v": "和平发展道路"}], "a": "D", "at": "D. 和平发展道路", "note": "中国式现代化是走和平发展道路的现代化，这是中国式现代化的重要特征之一。"}, {"id": "12", "sec": "第七讲", "type": "单选题", "q": "构建人类命运共同体是习近平外交思想的（ ）。", "options": [{"k": "A", "v": "核心理念"}, {"k": "B", "v": "重点方向"}, {"k": "C", "v": "实践平台"}, {"k": "D", "v": "项目机制"}], "a": "A", "at": "A. 核心理念", "note": "构建人类命运共同体是习近平外交思想的核心理念，回答了\"建设一个什么样的世界、怎样建设这个世界\"的时代之问。"}, {"id": "13", "sec": "第七讲", "type": "单选题", "q": "构建人类命运共同体回答了哪一时代之问？（ ）", "options": [{"k": "A", "v": "为什么要发展、发展为了谁"}, {"k": "B", "v": "建设一个什么样的世界、怎样建设这个世界"}, {"k": "C", "v": "世界需要什么样的安全理念、各国怎样实现共同安全"}, {"k": "D", "v": "构建什么样的全球治理体系，如何改革完善全球治理"}], "a": "B", "at": "B. 建设一个什么样的世界、怎样建设这个世界", "note": "构建人类命运共同体回答的是\"建设一个什么样的世界、怎样建设这个世界\"这一时代之问。"}, {"id": "14", "sec": "第七讲", "type": "单选题", "q": "构建人类命运共同体以什么为路径？（ ）", "options": [{"k": "A", "v": "和平发展道路"}, {"k": "B", "v": "构建新型国际关系"}, {"k": "C", "v": "共商共建共享的全球治理"}, {"k": "D", "v": "践行全人类共同价值"}], "a": "C", "at": "C. 共商共建共享的全球治理", "note": "构建人类命运共同体，以建设\"五个世界\"为目标，以共商共建共享的全球治理为路径，以践行全人类共同价值为遵循，以构建新型国际关系为支撑。"}, {"id": "15", "sec": "第七讲", "type": "单选题", "q": "中国始终将自己定位为\"全球南方\"的（ ）。", "options": [{"k": "A", "v": "建设力量"}, {"k": "B", "v": "中坚力量"}, {"k": "C", "v": "促进力量"}, {"k": "D", "v": "一员"}], "a": "D", "at": "D. 一员", "note": "中国始终把自己定位为\"全球南方\"的一员，同广大发展中国家同呼吸、共命运。"}, {"id": "16", "sec": "第七讲", "type": "单选题", "q": "中国将共建什么作为重要实践平台？（ ）", "options": [{"k": "A", "v": "\"一带一路\""}, {"k": "B", "v": "国际调解院"}, {"k": "C", "v": "全球发展促进中心"}, {"k": "D", "v": "文明对话国际日"}], "a": "A", "at": "A. \"一带一路\"", "note": "共建\"一带一路\"是构建人类命运共同体的重要实践平台。"}, {"id": "17", "sec": "第七讲", "type": "单选题", "q": "中老铁路于什么时候通车？（ ）", "options": [{"k": "A", "v": "2016 年"}, {"k": "B", "v": "2021 年 12 月"}, {"k": "C", "v": "2023 年 1 月"}, {"k": "D", "v": "2025 年 9 月"}], "a": "B", "at": "B. 2021 年 12 月", "note": "中老铁路于 2021 年 12 月 3 日正式通车运营。"}, {"id": "18", "sec": "第七讲", "type": "单选题", "q": "中老铁路使老挝由\"陆锁国\"转变为（ ）。", "options": [{"k": "A",
