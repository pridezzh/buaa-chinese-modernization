同角度说明（ ）。", "options": [{"k": "A", "v": "人类文明并不是沿着单一模式展开的"}, {"k": "B", "v": "人类文明只有一种合法形态"}, {"k": "C", "v": "现代文明只能由西方定义"}, {"k": "D", "v": "文明演变已经终结"}], "a": "A", "at": "A. 人类文明并不是沿着单一模式展开的", "note": "斯宾格勒、汤因比的研究均表明人类文明呈现多种形态、多条路径，并非沿单一模式展开。"}, {"id": "9", "sec": "第八讲", "type": "单选题", "q": "人类文明的多样性之所以重要，是因为多样性是人类文明的魅力所在，更是（ ）。", "options": [{"k": "A", "v": "统一现代化标准的基础"}, {"k": "B", "v": "各国制定发展战略的主要依据"}, {"k": "C", "v": "世界发展的活力和动力之源"}, {"k": "D", "v": "单一文明模式的来源"}], "a": "C", "at": "C. 世界发展的活力和动力之源", "note": "文明多样性是人类文明的魅力所在，更是世界发展的活力和动力之源。"}, {"id": "10", "sec": "第八讲", "type": "单选题", "q": "人类文明新形态之\"新\"，主要是在对（ ）的超越中体现出来的。", "options": [{"k": "A", "v": "资本主义现代文明"}, {"k": "B", "v": "一切人类文明成果"}, {"k": "C", "v": "中华优秀传统文化"}, {"k": "D", "v": "国际合作实践"}], "a": "A", "at": "A. 资本主义现代文明", "note": "人类文明新形态之\"新\"，主要是在对资本主义现代文明的超越中体现出来的。"}, {"id": "11", "sec": "第八讲", "type": "单选题", "q": "资本主义现代文明在创造生产力和推动历史进步的同时，也伴随着对外扩张、殖民掠夺和（ ）。", "options": [{"k": "A", "v": "共同富裕"}, {"k": "B", "v": "全过程人民民主"}, {"k": "C", "v": "文明平等"}, {"k": "D", "v": "文明霸权"}], "a": "D", "at": "D. 文明霸权", "note": "资本主义现代文明伴随着对外扩张、殖民掠夺和文明霸权，把自身文明模式强加于人。"}, {"id": "12", "sec": "第八讲", "type": "单选题", "q": "与资本主义文明不同，中国式现代化创造的人类文明新形态坚持中国共产党领导，坚持中国特色社会主义，并坚持（ ）。", "options": [{"k": "A", "v": "以资本为中心"}, {"k": "B", "v": "以人民为中心"}, {"k": "C", "v": "偏重物质发展"}, {"k": "D", "v": "奉行国强必霸"}], "a": "B", "at": "B. 以人民为中心", "note": "人类文明新形态坚持党的领导和中国特色社会主义，坚持以人民为中心而非以资本为中心。"}, {"id": "13", "sec": "第八讲", "type": "单选题", "q": "中国式现代化把（ ）放在核心位置。", "options": [{"k": "A", "v": "经济发展的速度"}, {"k": "B", "v": "人的发展"}, {"k": "C", "v": "技术能力的提升"}, {"k": "D", "v": "国际交往的扩大"}], "a": "B", "at": "B. 人的发展", "note": "中国式现代化把人的发展放在核心位置，现代化服务于人民对美好生活的向往。"}, {"id": "14", "sec": "第八讲", "type": "单选题", "q": "四川大凉山\"悬崖村\"的变化，生动印证了（ ）。", "options": [{"k": "A", "v": "脱贫攻坚和共同富裕的实践"}, {"k": "B", "v": "荒漠治理与生态致富相结合"}, {"k": "C", "v": "农业技术合作促进生产能力提升"}, {"k": "D", "v": "职业教育合作助力本土人才培养"}], "a": "A", "at": "A. 脱贫攻坚和共同富裕的实践", "note": "\"悬崖村\"从藤梯到钢梯再到搬迁新居，生动印证了脱贫攻坚和共同富裕的实践成效。"}, {"id": "15", "sec": "第八讲", "type": "单选题", "q": "人类文明新形态的重要世界意义之一，是拓展了（ ）。", "options": [{"k": "A", "v": "少数发达国家内部治理的单一路径"}, {"k": "B", "v": "古代农耕文明的复原方式"}, {"k": "C", "v": "发展中国家走向现代化的路径选择"}, {"k": "D", "v": "所有国家必须遵循的固定模式"}], "a": "C", "at": "C. 发展中国家走向现代化的路径选择", "note": "人类文明新形态为发展中国家走向现代化提供了新的路径选择，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择。"}, {"id": "16", "sec": "第八讲", "type": "判断题", "q": "随着工业革命和世界市场的形成，西方率先进入现代化进程，现代工业文明也由此同西方资本主义的兴起紧密联系在一起，并在相当长一个时期内主导了现代文明的话语表达和制度想象。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "西方率先实现现代化并长期主导现代文明的话语表达和制度想象，\"现代化=西方化\"的迷思由此形成。"}, {"id": "17", "sec": "第八讲", "type": "判断题", "q": "斯宾格勒、汤因比的研究均证明人类文明只有单一发展路径。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "恰恰相反，斯宾格勒、汤因比的研究从不同角度说明人类文明并不是沿着单一模式展开的。"}, {"id": "18", "sec": "第八讲", "type": "判断题", "q": "中国式现代化不仅深刻改变了中国，也正在创造一种不同于西方传统现代化模式的人类文明新形态。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化深刻改变了中国，也创造了人类文明新形态，打破了\"现代化=西方化\"的迷思。"}, {"id": "19", "sec": "第八讲", "type": "判断题", "q": "世界上既不存在定于一尊的现代化模式，也不存在放之四海而皆准的现代化标准。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "习近平总书记明确指出，世界上既不存在定于一尊的现代化模式，也不存在放之四海而皆准的现代化标准。"}, {"id": "20", "sec": "第八讲", "type": "判断题", "q": "现代文明等于西方文明，现代化也等于西化。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "\"现代化=西方化\"是必须打破的迷思；中国式现代化证明通向现代化有多条道路。"}, {"id": "21", "sec": "第八讲", "type": "判断题", "q": "不同国家可以基于自身历史文化与社会条件，走向不同的现代化道路。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "各国应立足自身历史文化与社会条件自主选择现代化道路。"}, {"id": "22", "sec": "第八讲", "type": "判断题", "q": "中国在鸦片战争中被西方国家的坚船利炮打开国门，被动卷入世界历史和现代化进程。这样的历史起点，决定了中国的现代化不可能照搬西方道路，只能在中华大地上探索适合自己的现代化道路。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "近代被动卷入现代化且屡遭侵略的历史，决定了中国不能照搬西方道路，必须自主探索适合自己的道路。"}, {"id": "23", "sec": "第八讲", "type": "判断题", "q": "中国式现代化所创造的人类文明新形态，是对西方现代文明的模仿和重复。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "人类文明新形态是对资本主义现代文明的超越，不是模仿和重复。"}, {"id": "24", "sec": "第八讲", "type": "判断题", "q": "进入 21 世纪以来，西方现代文明的局限和危机进一步显现，西方中心主义不断受到质疑与冲击。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "2008 年金融危机以来，西方现代文明的局限与危机进一步显现，西方中心主义不断受到质疑。"}, {"id": "25", "sec": "第八讲", "type": "判断题", "q": "资本主义现代文明曾经创造了巨大的生产力，推动了现代工业文明的形成，也深刻改变了世界历史进程。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "应辩证看待资本主义现代文明：它曾创造巨大生产力、深刻改变世界历史，但同时伴随着扩张、掠夺与霸权。"}, {"id": "26", "sec": "第八讲", "type": "判断题", "q": "资本主义文明能够\"终结\"文明演变的历史进程。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "人类文明演变没有终点，\"历史终结论\"已被实践证伪，资本主义文明不能终结文明演变进程。"}, {"id": "27", "sec": "第八讲", "type": "判断题", "q": "中国式现代化强调既要物质富足，也要精神富有。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化是物质文明和精神文明相协调的现代化，既要物质富足、也要精神富有。"}, {"id": "28", "sec": "第八讲", "type": "判断题", "q": "中国式现代化是文明更新的结果，不是文明断裂的产物。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化赓续中华文脉，是文明更新的结果而非文明断裂的产物。"}, {"id": "29", "sec": "第八讲", "type": "判断题", "q": "中国式现代化把人的发展放在核心位置，现代化不是只服务于资本增值，而是服务于人民对美好生活的向往。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "以人民为中心而非以资本为中心，是中国式现代化区别于西方现代化的根本所在。"}, {"id": "30", "sec": "第八讲", "type": "判断题", "q": "八步沙林场的故事生动体现了\"绿水青山就是金山银山\"的理念。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "八步沙\"六老汉\"三代人治沙造林，实现荒漠变绿洲、生态与致富双赢，生动诠释\"两山\"理念。"}, {"id": "31", "sec": "第八讲", "type": "判断题", "q": "中国没有重复发达国家先污染、后治理的老路，而是将绿色发展作为现代化的内在要求。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化坚持人与自然和谐共生，绿色发展是现代化的内在要求。"}, {"id": "32", "sec": "第八讲", "type": "判断题", "q": "在对外援助中，中国式现代化注重合作与赋能，而不是控制与依附；增强受援助国家自主发展的能力，而不是对外部力量的依赖。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国对外合作坚持授人以渔、合作赋能，鲁班工坊、菌草技术等均着眼于增强受援国自主发展能力。"}, {"id": "33", "sec": "第八讲", "type": "判断题", "q": "中国式现代化走出了一条不同于\"国强必霸\"的和平发展新路。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化走和平发展道路，打破了\"国强必霸\"的大国崛起旧逻辑。"}, {"id": "34", "sec": "第八讲", "type": "判断题", "q": "面对国际冲突，中国坚持劝和促谈，不拱火递刀、不激化矛盾。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国在国际热点冲突中始终坚持劝和促谈，不拱火浇油、不递刀子，致力于政治解决。"}, {"id": "35", "sec": "第八讲", "type": "判断题", "q": "人类文明新形态是在中国大地上形成和发展的，具有鲜明的中国特色，同时又超越了一国一域的狭隘经验，具有重要的世界意义。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "人类文明新形态兼具中国特色与世界意义，超越了国别、地域的狭隘经验。"}, {"id": "36", "sec": "第八讲", "type": "多选题", "q": "中国式现代化所展现的发展道路，更加注重（ ）。", "options": [{"k": "A", "v": "共同发展"}, {"k": "B", "v": "能力建设"}, {"k": "C", "v": "文明互鉴"}, {"k": "D", "v": "和平合作"}], "a": "ABCD", "at": "A. 共同发展；B. 能力建设；C. 文明互鉴；D. 和平合作", "note": "中国式现代化展现的发展道路更加注重共同发展、能力建设、文明互鉴与和平合作，全选。"}, {"id": "37", "sec": "第八讲", "type": "多选题", "q": "习近平总书记关于中国式现代化创造人类文明新形态的重要论述指出，中国式现代化（ ）。", "options": [{"k": "A", "v": "深深植根于中华优秀传统文化"}, {"k": "B", "v": "体现科学社会主义的先进本质"}, {"k": "C", "v": "借鉴吸收一切人类优秀文明成果"}, {"k": "D", "v": "展现了不同于西方现代化模式的新图景"}], "a": "ABCD", "at": "A. 深深植根于中华优秀传统文化；B. 体现科学社会主义的先进本质；C. 借鉴吸收一切人类优秀文明成果；D. 展现了不同于西方现代化模式的新图景", "note": "中国式现代化代表人类文明进步的发展方向：植根中华优秀传统文化、体现科学社会主义先进本质、借鉴吸收一切人类优秀文明成果、展现不同于西方现代化模式的新图景，全选。"}, {"id": "38", "sec": "第八讲", "type": "多选题", "q": "资本主义现代文明基于资本逻辑带来的问题包括（ ）。", "options": [{"k": "A", "v": "贫富分化"}, {"k": "B", "v": "物质主义和技术至上"}, {"k": "C", "v": "利己主义"}, {"k": "D", "v": "原子化个人主义乃至精神空虚"}], "a": "ABCD", "at": "A. 贫富分化；B. 物质主义和技术至上；C. 利己主义；D. 原子化个人主义乃至精神空虚", "note": "四项均为资本逻辑主导下资本主义现代文明的突出问题，全选。"}, {"id": "39", "sec": "第八讲", "type": "多选题", "q": "人类文明新形态对资本主义现代文明的超越，体现于以下关系的重塑：（ ）。", "options": [{"k": "A", "v": "物质世界与精神世界关系的重塑"}, {"k": "B", "v": "人与人关系的重塑"}, {"k": "C", "v": "人与自然关系的重塑"}, {"k": "D", "v": "本国与外部世界关系的重塑"}], "a": "ABCD", "at": "A. 物质世界与精神世界关系的重塑；B. 人与人关系的重塑；C. 人与自然关系的重塑；D. 本国与外部世界关系的重塑", "note": "人类文明新形态在物质与精神、人与人、人与自然、本国与外部世界四重关系上实现了对资本主义现代文明的超越，全选。"}, {"id": "40", "sec": "第八讲", "type": "多选题", "q": "人类文明新形态的重要世界意义包括（ ）。", "options": [{"k": "A", "v": "拓展了发展中国家走向现代化的路径选择"}, {"k": "B", "v": "为人类文明发展注入了新的动力"}, {"k": "C", "v": "代表着人类文明进步的发展方向"}, {"k": "D", "v": "形成了适用于所有国家的统一现代化模式"}], "a": "ABC", "at": "A. 拓展了发展中国家走向现代化的路径选择；B. 为人类文明发展注入了新的动力；C. 代表着人类文明进步的发展方向", "note": "人类文明新形态拓展了路径选择、注入新动力、代表进步方向；它恰恰不提供\"适用于所有国家的统一模式\"，D 错误。"}, {"id": "1", "sec": "第九讲", "type": "单选题", "q": "党的二十届三中全会通过的《中共中央关于进一步全面深化改革、推进中国式现代化的决定》明确指出，教育、科技、人才是中国式现代化的（ ）。", "options": [{"k": "A", "v": "根本性、决定性保障"}, {"k": "B", "v": "基础性、战略性支撑"}, {"k": "C", "v": "先导性、关键性保障"}, {"k": "D", "v": "战略性、根本性动力"}], "a": "B", "at": "B. 基础性、战略性支撑", "note": "《决定》明确指出，教育、科技、人才是中国式现代化的基础性、战略性支撑。"}, {"id": "2", "sec": "第九讲", "type": "单选题", "q": "世界强国的发展历程无不遵循的演进规律是（ ）。", "options": [{"k": "A", "v": "科技强国—教育强国—人才强国—世界强国"}, {"k": "B", "v": "人才强国—教育强国—科技强国—世界强国"}, {"k": "C", "v": "教育强国—科技强国—人才强国—世界强国"}, {"k": "D", "v": "教育强国—人才强国—科技强国—世界强国"}], "a": "C", "at": "C. 教育强国—科技强国—人才强国—世界强国", "note": "世界强国的崛起普遍遵循\"教育强国—科技强国—人才强国—世界强国\"的演进规律，教育是基点。"}, {"id": "3", "sec": "第九讲", "type": "单选题", "q": "教育、科技、人才三者实现有效联动、系统集成，可以形成（ ），为实现高质量发展注入源源不竭的内生动力。", "options": [{"k": "A", "v": "规模效应"}, {"k": "B", "v": "协同效应"}, {"k": "C", "v": "倍增效应"}, {"k": "D", "v": "集聚效应"}], "a": "C", "at": "C. 倍增效应", "note": "教育、科技、人才一体化推进、系统集成，可以形成\"倍增效应\"。"}, {"id": "4", "sec": "第九讲", "type": "单选题", "q": "在许多领域，我国与国际先进水平相比还有较大差距，能够拉动经济上水平的关键技术人家不给，这就使要素的规模驱动力减弱，经济增长将更多依靠（ ），必须使创新成为驱动发展新引擎。", "options": [{"k": "A", "v": "人口数量和资源投入"}, {"k": "B", "v": "土地资源和劳动力成本"}, {"k": "C", "v": "人力资本质量和技术进步"}, {"k": "D", "v": "外资引进和贸易扩大"}], "a": "C", "at": "C. 人力资本质量和技术进步", "note": "要素规模驱动减弱后，经济增长更多依靠人力资本质量提升和技术进步，创新成为第一动力。"}, {"id": "5", "sec": "第九讲", "type": "单选题", "q": "教育强国\"六大特质\"中的人才竞争力和科技支撑力，集中体现了教育的（ ）。", "options": [{"k": "A", "v": "政治属性"}, {"k": "B", "v": "战略属性"}, {"k": "C", "v": "人民属性"}, {"k": "D", "v": "文化属性"}], "a": "B", "at": "B. 战略属性", "note": "人才竞争力和科技支撑力集中体现教育的战略属性，思政引领力体现政治属性，民生保障力体现人民属性。"}, {"id": "6", "sec": "第九讲", "type": "单选题", "q": "2024 年 9 月，新时代第二次全国教育大会指出，教育是（ ）。", "options": [{"k": "A", "v": "现代化建设的根本动力"}, {"k": "B", "v": "强国建设、民族复兴之基"}, {"k": "C", "v": "科技创新的唯一基础"}, {"k": "D", "v": "综合国力竞争的核心"}], "a": "B", "at": "B. 强国建设、民族复兴之基", "note": "2024 年全国教育大会强调，教育是强国建设、民族复兴之基。"}, {"id": "7", "sec": "第九讲", "type": "单选题", "q": "在教育强国\"六大特质\"中，置于首位的是（ ）。", "options": [{"k": "A", "v": "人才竞争力"}, {"k": "B", "v": "科技支撑力"}, {"k": "C", "v": "民生保障力"}, {"k": "D", "v": "思政引领力"}], "a": "D", "at": "D. 思政引领力", "note": "\"六大特质\"以思政引领力置于首位，体现教育的政治属性和立德树人根本方向。"}, {"id": "8", "sec": "第九讲", "type": "单选题", "q": "建设教育强国需要正确处理的\"五个重大关系\"中，体现教育事业发展实践要求的是（ ）。", "options": [{"k": "A", "v": "支撑国家战略和满足民生需求"}, {"k": "B", "v": "知识学习和全面发展"}, {"k": "C", "v": "培养人才和满足社会需要"}, {"k": "D", "v": "规范有序和激发活力"}], "a": "C", "at": "C. 培养人才和满足社会需要", "note": "\"培养人才和满足社会需要\"体现教育服务经济社会发展的实践要求；其余关系分别对应功能定位、育人本质、教育治理与开放格局。"}, {"id": "9", "sec": "第九讲", "type": "单选题", "q": "教育强国建设中，提高人才自主培养能力，要突出培养（ ），为强国建设、民族复兴提供坚强人才保证和智力支持。", "options": [{"k": "A", "v": "一般专业技术人才"}, {"k": "B", "v": "国家重大战略急需人才"}, {"k": "C", "v": "国际贸易人才"}, {"k": "D", "v": "管理服务人才"}], "a": "B", "at": "B. 国家重大战略急需人才", "note": "人才自主培养要突出培养国家重大战略急需人才，聚焦关键领域和\"卡脖子\"环节。"}, {"id": "10", "sec": "第九讲", "type": "单选题", "q": "建设教育强国，坚持以人民为中心，需要不断提升教育公共服务的（ ），深入实施国家教育数字化战略，扩大优质教育资源受益面。", "options": [{"k": "A", "v": "公平性、竞争性、开放性"}, {"k": "B", "v": "普惠性、可及性、便捷性"}, {"k": "C", "v": "专业性、技术性、国际性"}, {"k": "D", "v": "统一性、标准性、规范性"}], "a": "B", "at": "B. 普惠性、可及性、便捷性", "note": "要不断提升教育公共服务的普惠性、可及性、便捷性，让教育改革发展成果更多更公平惠及全体人民。"}, {"id": "11", "sec": "第九讲", "type": "单选题", "q": "为解决人民群众关于教育的急难愁盼问题，要发挥教育促进人的全面发展和（ ）的基础性作用。", "options": [{"k": "A", "v": "社会公平"}, {"k": "B", "v": "全体人民共同富裕"}, {"k": "C", "v": "经济高速增长"}, {"k": "D", "v": "科技创新"}], "a": "B", "at": "B. 全体人民共同富裕", "note": "要发挥教育促进人的全面发展和全体人民共同富裕的基础性作用。"}, {"id": "12", "sec": "第九讲", "type": "单选题", "q": "基础研究是整个科学体系的（ ），是所有技术问题的总机关。", "options": [{"k": "A", "v": "终点"}, {"k": "B", "v": "核心"}, {"k": "C", "v": "源头"}, {"k": "D", "v": "保障"}], "a": "C", "at": "C. 源头", "note": "习近平总书记指出，基础研究是整个科学体系的源头，是所有技术问题的总机关。"}, {"id": "13", "sec": "第九讲", "type": "单选题", "q": "美国的《拜杜法案》、\"信息高速公路计划\"等案例证明，科技创新能力竞争的背后，实际上是（ ）的竞争。", "options": [{"k": "A", "v": "人口规模"}, {"k": "B", "v": "制度"}, {"k": "C", "v": "资源"}, {"k": "D", "v": "市场"}], "a": "B", "at": "B. 制度", "note": "《拜杜法案》、\"信息高速公路计划\"等表明，科技创新竞争的背后是国家制度安排与制度供给的竞争。"}, {"id": "14", "sec": "第九讲", "type": "单选题", "q": "将高水平科技自立自强概括为\"三个必须\"，其中不包括（ ）。", "options": [{"k": "A", "v": "在战略必争之地、必争领域必须占有一席之地"}, {"k": "B", "v": "在关键领域必须占领制高点"}, {"k": "C", "v": "在所有领域都不能留空白"}, {"k": "D", "v": "在所有科技领域必须实现世界第一"}], "a": "D", "at": "D. 在所有科技领域必须实现世界第一", "note": "高水平科技自立自强并非要求在所有科技领域都实现世界第一，D 不属于\"三个必须\"。"}, {"id": "15", "sec": "第九讲", "type": "单选题", "q": "从生产要素相对优势看，新时代我国经济增长更多依靠人力资本质量和技术进步，其深层背景是（ ）。", "options": [{"k": "A", "v": "我国已经完成工业化"}, {"k": "B", "v": "人口老龄化加速，劳动年龄人口总量下降，农业富余劳动力减少"}, {"k": "C", "v": "我国人口总量持续快速增长"}, {"k": "D", "v": "国际贸易规模持续下降"}], "a": "B", "at": "B. 人口老龄化加速，劳动年龄人口总量下降，农业富余劳动力减少", "note": "人口老龄化加速、劳动年龄人口下降、农业富余劳动力减少，使要素规模驱动力减弱，增长动力必须转向人力资本质量和技术进步。"}, {"id": "16", "sec": "第九讲", "type": "单选题", "q": "下列哪项不属于《教育强国建设规划纲要（2024—2035 年）》提出构建的教育体系？（ ）", "options": [{"k": "A", "v": "产教融合的职业教育体系"}, {"k": "B", "v": "泛在可及的终身教育体系"}, {"k": "C", "v": "创新牵引的科技支撑体系"}, {"k": "D", "v": "高度统一的教育管理体系"}], "a": "D", "at": "D. 高度统一的教育管理体系", "note": "纲要部署构建的\"八大体系\"包括产教融合的职业教育体系、泛在可及的终身教育体系、创新牵引的科技支撑体系等；\"高度统一的教育管理体系\"不属于其中。"}, {"id": "17", "sec": "第九讲", "type": "单选题", "q": "在国家战略科技力量中，高水平研究型大学的重要定位是（ ）。", "options": [{"k": "A", "v": "科技成果产业化的唯一主体"}, {"k": "B", "v": "基础研究的主力军和重大科技突破的生力军"}, {"k": "C", "v": "国际科技交流的唯一平台"}, {"k": "D", "v": "国家重大工程的管理主体"}], "a": "B", "at": "B. 基础研究的主力军和重大科技突破的生力军", "note": "高水平研究型大学是国家战略科技力量的重要组成部分，定位为基础研究的主力军和重大科技突破的生力军。"}, {"id": "18", "sec": "第九讲", "type": "单选题", "q": "在新型举国体制中，\"四个面向\"主要体现的是（ ）。", "options": [{"k": "A", "v": "科技攻关的战略导向"}, {"k": "B", "v": "教育改革的评价导向"}, {"k": "C", "v": "人才评价的职业导向"}, {"k": "D", "v": "国际交流的开放导向"}], "a": "A", "at": "A. 科技攻关的战略导向", "note": "\"四个面向\"为科技攻关确立战略导向，指明科技创新的主攻方向。"}, {"id": "19", "sec": "第九讲", "type": "单选题", "q": "新型举国体制不能泛化，要坚持国家战略目标导向，立足\"四个面向\"。下列不属于\"四个面向\"的是（ ）。", "options": [{"k": "A", "v": "面向人才评价指标"}, {"k": "B", "v": "面向世界科技前沿"}, {"k": "C", "v": "面向经济主战场"}, {"k": "D", "v": "面向国家重大需求"}], "a": "A", "at": "A. 面向人才评价指标", "note": "\"四个面向\"是面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康；\"面向人才评价指标\"不属于其中。"}, {"id": "20", "sec": "第九讲", "type": "单选题", "q": "\"国家战略人才力量\"这一概念的提出，体现了人才分类从传统的行业和职业静态划分转向（ ）。", "options": [{"k": "A", "v": "以学历层次为导向"}, {"k": "B", "v": "以职业收入为导向"}, {"k": "C", "v": "以国家战略需求为导向"}, {"k": "D", "v": "以国际排名为导向"}], "a": "C", "at": "C. 以国家战略需求为导向", "note": "\"国家战略人才力量\"以国家战略需求为导向界定人才，突破了按行业职业静态划分的传统思路。"}, {"id": "21", "sec": "第九讲", "type": "单选题", "q": "关于中央人才工作会议后党中央成立的中央人才工作领导小组，下列表述正确的是（ ）。", "options": [{"k": "A", "v": "成立于 2003 年"}, {"k": "B", "v": "属于议事协调机构"}, {"k": "C", "v": "是在党中央领导下对人才工作进行重大战略决策的机构"}, {"k": "D", "v": "实现从\"领导小组\"到\"协调小组\"的转变"}], "a": "C", "at": "C. 是在党中央领导下对人才工作进行重大战略决策的机构", "note": "中央人才工作领导小组是在党中央领导下对人才工作进行重大战略决策的机构。"}, {"id": "22", "sec": "第九讲", "type": "多选题", "q": "一体推进教育、科技、人才发展的依据主要包括（ ）。", "options": [{"k": "A", "v": "对世界现代化规律的深刻洞察"}, {"k": "B", "v": "我国教育、科技、人才事业快速发展的宝贵经验"}, {"k": "C", "v": "新时代我国经济社会高质量发展的客观要求"}, {"k": "D", "v": "传统产业发展的内在要求"}], "a": "ABC", "at": "A. 对世界现代化规律的深刻洞察；B. 我国教育、科技、人才事业快速发展的宝贵经验；C. 新时代我国经济社会高质量发展的客观要求", "note": "一体推进的依据是对世界现代化规律的洞察、我国事业快速发展的经验总结和高质量发展的客观要求；\"传统产业发展的内在要求\"不属于其中。"}, {"id": "23", "sec": "第九讲", "type": "多选题", "q": "\"国家战略科技力量\"重要组成部分包括（ ）。", "options": [{"k": "A", "v": "国家实验室"}, {"k": "B", "v": "国家科研机构"}, {"k": "C", "v": "高水平研究型大学"}, {"k": "D", "v": "科技领军企业"}], "a": "ABCD", "at": "A. 国家实验室；B. 国家科研机构；C. 高水平研究型大学；D. 科技领军企业", "note": "国家实验室、国家科研机构、高水平研究型大学、科技领军企业是国家战略科技力量的重要组成部分，全选。"}, {"id": "24", "sec": "第九讲", "type": "多选题", "q": "习近平总书记总结我国科技事业快速发展的重要经验包括（ ）。", "options": [{"k": "A", "v": "发挥社会主义制度优越性，集中力量办大事"}, {"k": "B", "v": "坚持以提升创新能力为主线"}, {"k": "C", "v": "坚持以人为本，充分调动人才积极性、主动性、创造性"}, {"k": "D", "v": "坚持以扩大资本投入为核心"}], "a": "ABC", "at": "A. 发挥社会主义制度优越性，集中力量办大事；B. 坚持以提升创新能力为主线；C. 坚持以人为本，充分调动人才积极性、主动性、创造性", "note": "重要经验包括发挥制度优势集中力量办大事、坚持提升创新能力为主线、坚持以人为本调动人才积极性；\"以扩大资本投入为核心\"不属于其中。"}, {"id": "25", "sec": "第九讲", "type": "多选题", "q": "关于\"国家战略人才力量\"，下列说法正确的是（ ）。", "options": [{"k": "A", "v": "2021 年中央人才工作会议首次提出这一新理念"}, {"k": "B", "v": "这一概念强调以国家战略需求为导向进行人才分类"}, {"k": "C", "v": "党的二十大再次对加快建设国家战略人才力量作出部署"}, {"k": "D", "v": "党的二十大提出培养造就大师、战略科学家等人才"}], "a": "ABCD", "at": "A. 2021 年中央人才工作会议首次提出这一新理念；B. 这一概念强调以国家战略需求为导向进行人才分类；C. 党的二十大再次对加快建设国家战略人才力量作出部署；D. 党的二十大提出培养造就大师、战略科学家等人才", "note": "四项均正确：2021 年中央人才工作会议首次提出，以国家战略需求为导向，党的二十大再次部署并提出培养造就大师、战略科学家、一流科技领军人才等，全选。"}, {"id": "26", "sec": "第九讲", "type": "多选题", "q": "关于教育强国\"六大特质\"与教育属性之间的关系，下列说法正确的是（ ）。", "options": [{"k": "A", "v": "思政引领力集中体现教育的政治属性"}, {"k": "B", "v": "人才竞争力和科技支撑力集中体现教育的战略属性"}, {"k": "C", "v": "民生保障力充分展现教育的人民属性"}, {"k": "D", "v": "社会协同力体现教育的经济属性"}], "a": "ABC", "at": "A. 思政引领力集中体现教育的政治属性；B. 人才竞争力和科技支撑力集中体现教育的战略属性；C. 民生保障力充分展现教育的人民属性", "note": "思政引领力对应政治属性，人才竞争力和科技支撑力对应战略属性，民生保障力对应人民属性；\"社会协同力体现经济属性\"的对应关系错误，D 不选。"}, {"id": "27", "sec": "第九讲", "type": "多选题", "q": "关于新型举国体制，下列表述正确的有（ ）。", "options": [{"k": "A", "v": "要强化党和国家作为重大科技创新领导者、组织者的作用"}, {"k": "B", "v": "要充分发挥市场体制作用"}, {"k": "C", "v": "为维护国家战略安全、实现高水平科技自立自强、推动高质量发展提供有力支撑"}, {"k": "D", "v": "要完全依靠政府力量开展科技攻关"}], "a": "ABC", "at": "A. 要强化党和国家作为重大科技创新领导者、组织者的作用；B. 要充分发挥市场体制作用；C. 为维护国家战略安全、实现高水平科技自立自强、推动高质量发展提供有力支撑", "note": "新型举国体制坚持党的领导和有为政府与有效市场相结合，为战略安全、自立自强和高质量发展提供支撑；\"完全依靠政府力量\"说法错误，D 不选。"}, {"id": "28", "sec": "第九讲", "type": "多选题", "q": "《教育强国建设规划纲要（2024—2035 年）》围绕教育强国建设进行了系统部署，下列说法正确的是（ ）。", "options": [{"k": "A", "v": "把握教育的\"三大属性\""}, {"k": "B", "v": "聚焦教育强国的\"六大特质\""}, {"k": "C", "v": "正确处理\"五大关系\""}, {"k": "D", "v": "构建八个方面的教育体系"}], "a": "ABCD", "at": "A. 把握教育的\"三大属性\"；B. 聚焦教育强国的\"六大特质\"；C. 正确处理\"五大关系\"；D. 构建八个方面的教育体系", "note": "纲要把握教育的政治属性、人民属性、战略属性，聚焦\"六大特质\"，正确处理\"五个重大关系\"，部署构建\"八大体系\"，全选。"}, {"id": "29", "sec": "第九讲", "type": "多选题", "q": "关于国际科学、技术、工程、数学（STEM）教育研究所落户上海，下列说法正确的是（ ）。", "options": [{"k": "A", "v": "这是联合国教科文组织在全球设立的第十个一类中心"}, {"k": "B", "v": "这是在欧美之外的首个全球性一类中心"}, {"k": "C", "v": "该机构于 2023 年落户上海"}, {"k": "D", "v": "这是我国自主设立的第一个 STEM 教育研究机构"}], "a": "ABC", "at": "A. 这是联合国教科文组织在全球设立的第十个一类中心；B. 这是在欧美之外的首个全球性一类中心；C. 该机构于 2023 年落户上海", "note": "国际 STEM 教育研究所是教科文组织在全球设立的第 10 个一类中心、欧美之外的首个全球性一类中心，于 2023 年宣布落户上海；它由教科文组织设立而非我国自主设立，D 错误。"}, {"id": "30", "sec": "第九讲", "type": "多选题", "q": "关于 2013—2020 年我国人才工作改革发展，下列说法正确的是（ ）。", "options": [{"k": "A", "v": "2013 年党的十八届三中全会提出\"建立集聚人才体制机制\""}, {"k": "B", "v": "2016 年出台《关于深化人才发展体制机制改革的意见》"}, {"k": "C", "v": "2017 年党的十九大强调坚持党管人才原则、加快建设人才强国"}, {"k": "D", "v": "2018 年明确将\"着力集聚爱国奉献的各方面优秀人才\"纳入新时代党的组织路线"}], "a": "ABCD", "at": "A. 2013 年党的十八届三中全会提出\"建立集聚人才体制机制\"；B. 2016 年出台《关于深化人才发展体制机制改革的意见》；C. 2017 年党的十九大强调坚持党管人才原则、加快建设人才强国；D. 2018 年明确将\"着力集聚爱国奉献的各方面优秀人才\"纳入新时代党的组织路线", "note": "四项均符合 2013—2020 年人才工作改革发展的实际进程，全选。"}, {"id": "31", "sec": "第九讲", "type": "多选题", "q": "在科研基础条件建设方面，下列说法正确的是（ ）。", "options": [{"k": "A", "v": "前瞻布局建设重大科技基础设施"}, {"k": "B", "v": "强化高端科研仪器自主保障"}, {"k": "C", "v": "强化科学数据、科技期刊等基础条件自主保障"}, {"k": "D", "v": "停止人工智能与科学研究结合"}], "a": "ABC", "at": "A. 前瞻布局建设重大科技基础设施；B. 强化高端科研仪器自主保障；C. 强化科学数据、科技期刊等基础条件自主保障", "note": "科研基础条件建设要求前瞻布局重大科技基础设施、强化高端仪器和科学数据、科技期刊等自主保障；\"停止人工智能与科学研究结合\"说法错误，D 不选。"}, {"id": "32", "sec": "第九讲", "type": "判断题", "q": "建设教育强国的根本任务是为党育人、为国育才。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "建设教育强国的根本任务是立德树人；\"为党育人、为国育才\"是教育的初心使命和根本目标指向，二者不宜混同。"}, {"id": "33", "sec": "第九讲", "type": "判断题", "q": "2024 年全国教育大会强调，建成教育强国是\"实现以中国式现代化全面推进强国建设、民族复兴伟业的先导任务、坚实基础、战略支撑\"。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "2024 年全国教育大会对建成教育强国的战略地位作出了这一明确界定。"}, {"id": "34", "sec": "第九讲", "type": "判断题", "q": "教育强国\"六大特质\"包括思政引领力、人才竞争力、科技支撑力、民生保障力、社会协同力和国际影响力。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"六大特质\"即思政引领力、人才竞争力、科技支撑力、民生保障力、社会协同力、国际影响力。"}, {"id": "35", "sec": "第九讲", "type": "判断题", "q": "一个国家是否强大主要取决于经济总量，一个民族是否强盛主要取决于人口规模和领土面积。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "国家强大、民族强盛的根本在于教育、科技、人才，而非单纯的经济总量、人口规模或领土面积。"}, {"id": "36", "sec": "第九讲", "type": "判断题", "q": "习近平总书记指出，科技强国必须拥有强大的基础研究和原始创新能力、关键核心技术攻关能力、国际影响力和引领力、高水平科技人才培养和集聚能力以及科技治理体系和治理能力。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "这是习近平总书记关于科技强国必须具备的\"五个方面能力\"的重要论述。"}, {"id": "37", "sec": "第九讲", "type": "判断题", "q": "党的十八大以来，我国学前教育、义务教育普及程度已经达到高收入国家平均水平。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "我国学前教育和义务教育普及水平已达到高收入国家平均水平，基础教育整体水平居全球前列。"}, {"id": "38", "sec": "第九讲", "type": "判断题", "q": "\"坚持把立德树人作为根本任务\"是\"九个坚持\"的重要内容，并且应将立德树人成效作为检验学校一切工作的根本标准。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "立德树人是教育的根本任务，立德树人成效是检验学校一切工作的根本标准。"}, {"id": "39", "sec": "第九讲", "type": "判断题", "q": "五个世界科学中心都是先成为世界科学中心，而后成为世界教育中心、人才中心，并最终崛起为世界强国。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "历史规律正好相反：历次世界科学中心转移之前，都先出现了世界教育中心、人才中心的转移，即教育先行、人才先聚。"}, {"id": "40", "sec": "第九讲", "type": "判断题", "q": "新型举国体制的\"四个面向\"是面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"四个面向\"为科技创新确立了战略方向。"}, {"id": "41", "sec": "第九讲", "type": "判断题", "q": "\"自立自强\"意味着不仅要\"立\"，更要\"强\"。\"自立\"体现为独立自主，实现产业链供应链的自主、安全、可控；\"自强\"则意味着实现更高质量、更高效率的创新，塑造国家发展新优势。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "\"自立\"重在自主安全可控，\"自强\"重在更高质量更高效率的创新塑造新优势，题干表述准确。"}, {"id": "1", "sec": "结语", "type": "单选题", "q": "中国式现代化能够成功的关键因素是（ ）。", "options": [{"k": "A", "v": "引进国外先进文化"}, {"k": "B", "v": "掌握先进科学技术"}, {"k": "C", "v": "中国共产党的领导"}], "a": "C", "at": "C. 中国共产党的领导", "note": "中国共产党的领导是中国式现代化能够成功的关键因素，党的领导决定中国式现代化的根本方向、前途命运和最终成败。"}, {"id": "2", "sec": "结语", "type": "单选题", "q": "以下说法错误的是（ ）。", "options": [{"k": "A", "v": "中国式现代化是以人民为中心的现代化"}, {"k": "B", "v": "人民是历史的创造者"}, {"k": "C", "v": "一个国家走向现代化，既要遵循现代化一般规律，更要符合本国实际，具有本国特色"}, {"k": "D", "v": "一个国家选择什么样的现代化道路，是由别的国家的成功经验决定的"}], "a": "D", "at": "D. 一个国家选择什么样的现代化道路，是由别的国家的成功经验决定的", "note": "一个国家选择什么样的现代化道路，是由本国历史传统、社会制度、发展条件、外部环境等诸多因素决定的，不能照搬别国经验；A、B、C 表述均正确。"}, {"id": "3", "sec": "结语", "type": "多选题", "q": "一个国家选择什么样的现代化道路，是由其（ ）等诸多因素决定的。", "options": [{"k": "A", "v": "历史传统"}, {"k": "B", "v": "社会制度"}, {"k": "C", "v": "发展条件"}, {"k": "D", "v": "外部环境"}], "a": "ABCD", "at": "A. 历史传统；B. 社会制度；C. 发展条件；D. 外部环境", "note": "现代化道路的选择由历史传统、社会制度、发展条件、外部环境等诸多因素共同决定，全选。"}, {"id": "4", "sec": "结语", "type": "判断题", "q": "正是在党集中力量办大事的制度优势下，中国才能朝着既定目标制定和实施一个又一个五年规划，能够充分协调调动各方力量，实现经济快速发展和社会长期稳定。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "集中力量办大事的制度优势使中国能够一张蓝图绘到底，通过一个个五年规划接续推进，实现\"两大奇迹\"。"}, {"id": "5", "sec": "结语", "type": "判断题", "q": "从第一个五年计划到第十四个五年规划，一以贯之的主题是把我国建设成为中等收入国家。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "一以贯之的主题是把我国建设成为社会主义现代化国家（建设社会主义现代化强国），而非\"中等收入国家\"。"}, {"id": "6", "sec": "结语", "type": "判断题", "q": "中国式现代化是照搬现成模式的结果。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "×", "at": "错误", "note": "中国式现代化是党领导人民立足中国国情、独立自主探索出来的，不是照搬任何现成模式的结果。"}, {"id": "7", "sec": "结语", "type": "判断题", "q": "习近平新时代中国特色社会主义思想是推进中国式现代化的根本遵循。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "习近平新时代中国特色社会主义思想是新时代推进中国式现代化的根本遵循和行动指南。"}, {"id": "8", "sec": "结语", "type": "判断题", "q": "中国式现代化打破了现代化等于西方化的迷思，创造了人类文明新形态。（ ）", "options": [{"k": "√", "v": "正确"}, {"k": "×", "v": "错误"}], "a": "√", "at": "正确", "note": "中国式现代化打破了\"现代化=西方化\"的迷思，创造了人类文明新形态，展现了现代化的另一幅图景。"}];
const list = document.getElementById('list');
const stat = document.getElementById('stat');
const input = document.getElementById('q');
const section = document.getElementById('section');
const answerToggle = document.getElementById('answerToggle');
const noteToggle = document.getElementById('noteToggle');
const random50 = document.getElementById('random50');
const clearFilters = document.getElementById('clearFilters');
let typeFilter = '';
let sectionFilter = '';
let showAnswer = true;
let showNote = true;
let randomIds = null;

const sections = [...new Set(DATA.map(d => d.sec))];
for (const sec of sections){
  const opt = document.createElement('option');
  opt.value = sec; opt.textContent = sec;
  section.appendChild(opt);
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function keysOf(k){ return k.trim().split(/\s+/).filter(Boolean); }
function hl(s, keys){
  let out = esc(s);
  for (const key of keys){
    const re = new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
    out = out.replace(re, m => '<mark>'+m+'</mark>');
  }
  return out;
}
function baseRows(){
  const keys = keysOf(input.value);
  let rows = DATA;
  if (typeFilter) rows = rows.filter(d => d.type === typeFilter);
  if (sectionFilter) rows = rows.filter(d => d.sec === sectionFilter);
  if (keys.length){
    rows = rows.filter(d => {
      const hay = d.q + ' ' + d.options.map(o=>o.k+o.v).join(' ') + ' ' + d.a + ' ' + d.at + ' ' + d.note + ' ' + d.sec;
      return keys.every(k => hay.indexOf(k) !== -1);
    });
  }
  return rows;
}
function render(){
  const keys = keysOf(input.value);
  let rows = baseRows();
  if (randomIds) rows = rows.filter(d => randomIds.has(d.sec + '-' + d.id));
  stat.textContent = randomIds ? ('随机练习 '+rows.length+' 题') : ((input.value.trim()||typeFilter||sectionFilter) ? ('匹配 '+rows.length+' 条') : ('共 '+DATA.length+' 题，输入关键词开始检索'));
  if (!rows.length){ list.innerHTML = '<div class="empty">未找到匹配题目</div>'; return; }
  let html = '';
  for (const d of rows){
    let opts = '';
    const chosen = showAnswer ? (d.a.match(/[A-D√×]/g) || []) : [];
    for (const o of d.options){
      const hit = chosen.includes(o.k);
      opts += '<li class="'+(hit?'hit':'')+'"><b>'+esc(o.k)+'.</b> '+hl(o.v, keys)+'</li>';
    }
    html += '<div class="item">'
      + '<span class="tag">'+esc(d.sec)+' 第'+esc(d.id)+'题</span>'
      + '<span class="tag type">'+esc(d.type)+'</span>'
      + '<div class="q">'+hl(d.q, keys)+'</div>'
      + (showAnswer ? '<div class="ans"><span class="ans-k">答案 '+esc(d.a)+'</span><span class="ans-v">'+hl(d.at, keys)+'</span></div>' : '')
      + (opts ? '<ul class="opts">'+opts+'</ul>' : '')
      + (showNote && d.note ? '<div class="note">简析：'+hl(d.note, keys)+'</div>' : '')
      + '</div>';
  }
  list.innerHTML = html;
}
input.addEventListener('input', () => { randomIds = null; random50.textContent = '随机抽50题'; render(); });
answerToggle.addEventListener('click', () => { showAnswer = !showAnswer; answerToggle.textContent = '答案：' + (showAnswer?'显示':'隐藏'); render(); });
noteToggle.addEventListener('click', () => { showNote = !showNote; noteToggle.textContent = '解析：' + (showNote?'显示':'隐藏'); render(); });
section.addEventListener('change', () => { sectionFilter = section.value; randomIds = null; random50.textContent = '随机抽50题'; render(); });
random50.addEventListener('click', () => {
  if (randomIds){ randomIds = null; random50.textContent = '随机抽50题'; render(); return; }
  const pool = baseRows().slice();
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  randomIds = new Set(pool.slice(0, 50).map(d => d.sec + '-' + d.id));
  random50.textContent = '返回全部题目'; render();
});
clearFilters.addEventListener('click', () => {
  input.value = ''; section.value = ''; sectionFilter = ''; typeFilter = ''; randomIds = null;
  random50.textContent = '随机抽50题';
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  render(); input.focus();
});
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    typeFilter = c.dataset.t;
    randomIds = null; random50.textContent = '随机抽50题';
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c && x.dataset.t));
    render();
  });
});
render('');
input.focus();
</script>
</body>
</html>
